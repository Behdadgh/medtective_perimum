<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آموزش تعاملی تفسیر سیستماتیک نوار قلب (ECG)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-soft: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      --primary: #0f4c81;
      --primary-hover: #0b3b66;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --teal: #0d9488;
      --teal-soft: #f0fdfa;
      --teal-border: #99f6e4;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --success-border: #bbf7d0;
      --warning: #b45309;
      --warning-soft: #fffbeb;
      --warning-border: #fde68a;
      --danger: #be123c;
      --danger-soft: #fff1f2;
      --danger-border: #fecdd3;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      --font: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.75;
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .en {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 0.92em;
      letter-spacing: 0.01em;
    }

    /* App Shell */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .top-bar-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
      min-width: 0;
    }

    .brand-mini span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-soft);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--surface-soft);
      border-color: var(--border-strong);
    }

    .progress-track {
      height: 4px;
      background: var(--surface-soft);
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.28s ease;
    }

    /* Main Content */
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 104px;
    }

    .screen-animate {
      animation: fadeSlideIn 0.22s ease forwards;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Typography */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--teal);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 12px;
    }

    h2 {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 10px;
    }

    h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .lead {
      font-size: 0.98rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Cards & Layout */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .card-soft {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .callout {
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 0.92rem;
      border: 1px solid var(--primary-border);
      background: var(--primary-soft);
      color: var(--text);
    }

    .callout.warning {
      background: var(--warning-soft);
      border-color: var(--warning-border);
    }

    .callout.danger {
      background: var(--danger-soft);
      border-color: var(--danger-border);
    }

    .callout.success {
      background: var(--success-soft);
      border-color: var(--success-border);
    }

    .callout-title {
      font-weight: 700;
      margin-bottom: 4px;
      display: block;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 560px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
      h1 { font-size: 1.9rem; }
      main { padding: 28px 20px 108px; }
    }

    .clean-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clean-list li {
      position: relative;
      padding-right: 18px;
      font-size: 0.94rem;
      color: var(--text);
    }

    .clean-list li::before {
      content: "";
      position: absolute;
      right: 0;
      top: 11px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .btn-secondary:hover {
      background: var(--surface-soft);
    }

    .btn-danger-outline {
      background: var(--surface);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .btn-danger-outline:hover {
      background: var(--danger-soft);
    }

    .btn-full {
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
    }

    .bottom-nav-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .bottom-nav .btn {
      flex: 1;
      max-width: 220px;
    }

    .hidden {
      display: none !important;
    }

    /* Hero / Start */
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: var(--shadow);
      text-align: right;
    }

    .hero-ecg-wrap {
      background: #0f172a;
      border-radius: 14px;
      padding: 16px;
      margin: 18px 0 22px;
      overflow: hidden;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .pill {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
    }

    /* Roadmap */
    .roadmap-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .roadmap-item {
      width: 100%;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .roadmap-item:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .roadmap-item.done {
      border-color: var(--success-border);
    }

    .roadmap-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-soft);
      color: var(--primary);
      font-weight: 800;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .roadmap-item.done .roadmap-num {
      background: var(--success-soft);
      color: var(--success);
    }

    .roadmap-info {
      flex: 1;
      min-width: 0;
    }

    .roadmap-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      display: block;
    }

    .roadmap-sub {
      font-size: 0.82rem;
      color: var(--text-light);
      display: block;
    }

    /* Segmented Tabs */
    .seg-tabs {
      display: flex;
      gap: 6px;
      background: var(--surface-soft);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .seg-tab {
      flex: 1;
      min-height: 42px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 10px;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .seg-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* SVG ECG Box */
    .ecg-box {
      background: #fffafa;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .ecg-box-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ecg-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Interactive Controls */
    .slider-group {
      margin-bottom: 14px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      height: 6px;
      cursor: pointer;
    }

    .metric-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .status-chip {
      font-size: 0.84rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
    }

    .status-chip.normal { background: var(--success-soft); color: var(--success); border: 1px solid var(--success-border); }
    .status-chip.tachy { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border); }
    .status-chip.brady { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning-border); }

    /* Matrix 2x2 */
    .matrix-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .matrix-btn {
      min-height: 64px;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      text-align: right;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .matrix-btn strong {
      display: block;
      font-size: 0.92rem;
      color: var(--text);
    }

    .matrix-btn span {
      font-size: 0.78rem;
      color: var(--text-light);
    }

    .matrix-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .matrix-btn.active strong {
      color: var(--primary);
    }

    /* Accordion */
    .accordion-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .accordion-trigger {
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: right;
    }

    .accordion-trigger:hover {
      background: var(--surface-soft);
    }

    .accordion-arrow {
      font-size: 0.85rem;
      color: var(--text-light);
      transition: transform 0.2s ease;
    }

    .accordion-item.open .accordion-arrow {
      transform: rotate(180deg);
    }

    .accordion-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .accordion-item.open .accordion-body {
      display: block;
      padding-top: 14px;
    }

    /* Reveal Answer Box */
    .reveal-box {
      border: 1px dashed var(--primary-border);
      background: var(--primary-soft);
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
    }

    .reveal-q {
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 10px;
      color: var(--text);
    }

    .reveal-a {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--primary-border);
      font-size: 0.92rem;
      color: var(--text);
    }

    /* Axis Controls */
    .thumb-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .thumb-toggle-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .thumb-btn {
      flex: 1;
      min-height: 44px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .thumb-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Matching Activity */
    .match-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 540px) {
      .match-grid {
        grid-template-columns: 1.25fr 1fr;
      }
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-item {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      text-align: right;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .match-item.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .match-item.solved {
      border-color: var(--success-border);
      background: var(--success-soft);
      color: var(--success);
      cursor: default;
    }

    .match-item.wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    /* 12-Lead Grid */
    .lead-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 0;
      direction: ltr;
    }

    .lead-cell {
      padding: 10px 6px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      text-align: center;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.18s ease;
    }

    .lead-cell.ste {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .lead-cell.recip {
      background: var(--warning-soft);
      border-color: var(--warning);
      color: var(--warning);
    }

    .territory-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip-btn {
      min-height: 40px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    .chip-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Quiz */
    .quiz-option {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      text-align: right;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.15s ease;
    }

    .quiz-option:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .quiz-option.correct {
      border-color: var(--success);
      background: var(--success-soft);
      color: var(--success);
    }

    .quiz-option.incorrect {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .quiz-feedback {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .quiz-feedback.correct {
      background: var(--success-soft);
      border: 1px solid var(--success-border);
      color: #14532d;
    }

    .quiz-feedback.incorrect {
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      color: #881337;
    }

    /* Flashcards */
    .flashcard-stage {
      min-height: 220px;
      background: var(--surface);
      border: 1.5px solid var(--border-strong);
      border-radius: 18px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      transition: border-color 0.15s ease;
    }

    .flashcard-stage:hover {
      border-color: var(--primary);
    }

    .flashcard-tag {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--teal);
      background: var(--teal-soft);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .flashcard-main {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.7;
    }

    .flashcard-hint {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 16px;
    }

      // SVG Generators
      let svgUid = 0;
      function svgGrid(w, h) {
        svgUid += 1;
        const sm = 'ecgSm_' + svgUid;
        const lg = 'ecgLg_' + svgUid;
        return `<defs>
          <pattern id="${sm}" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#fee2e2" stroke-width="0.7"/>
          </pattern>
          <pattern id="${lg}" width="50" height="50" patternUnits="userSpaceOnUse">
            <rect width="50" height="50" fill="url(#${sm})"/>
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#fca5a5" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="${w}" height="${h}" fill="url(#${lg})"/>`;
      }

      function renderRateSVG(bpm) {
        const w = 600, h = 110;
        // Space between beats inversely proportional to bpm
        const clamped = Math.max(35, Math.min(180, bpm));
        const pxPerBeat = Math.round(7500 / clamped);
        let path = `M 0 70 `;
        let x = 20;
        while (x < w - 20) {
          path += `L ${x} 70 Q ${x + 6} 58 ${x + 12} 70 L ${x + 18} 70 L ${x + 21} 76 L ${x + 26} 22 L ${x + 31} 82 L ${x + 35} 70 L ${x + 44} 70 Q ${x + 54} 52 ${x + 64} 70 `;
          x += pxPerBeat;
        }
        path += `L ${w} 70`;
        return `<svg class="ecg-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="نوار شبیه‌سازی ضربان قلب">
          ${svgGrid(w, h)}
          <path d="${path}" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>`;
      }

      function renderTachySVG(type) {
        const w = 600, h = 95;
        let path = '';
        if (type === 'narrow_reg') {
          let x = 10;
          path = 'M 0 60 ';
          while (x < w - 15) {
            path += `L ${x} 60 L ${x + 6} 60 L ${x + 9} 16 L ${x + 13} 68 L ${x + 16} 60 Q ${x + 24} 48 ${x + 32} 60 `;
            x += 48;
          }
        } else if (type === 'narrow_irreg') {
          const gaps = [42, 74, 50, 88, 44, 68, 56, 78];
          let x = 10, i = 0;
          path = 'M 0 60 ';
          while (x < w - 20) {
            path += `L ${x} 58 L ${x + 4} 62 L ${x + 8} 59 L ${x + 11} 16 L ${x + 15} 68 L ${x + 19} 60 L ${x + 25} 62 L ${x + 30} 58 `;
            x += gaps[i % gaps.length];
            i++;
          }
        } else if (type === 'wide_reg') {
          let x = 8;
          path = 'M 0 55 ';
          while (x < w - 20) {
            path += `C ${x + 12} 10, ${x + 24} 10, ${x + 34} 78 C ${x + 42} 90, ${x + 50} 55, ${x + 56} 55 `;
            x += 58;
          }
        } else {
          // Torsades ribbon-like polymorphic
          const amps = [34, 28, 16, 10, 18, 30, 38, 28, 14, 10, 22, 34, 30];
          let x = 6;
          path = 'M 0 50 ';
          amps.forEach((a) => {
            path += `Q ${x + 11} ${50 - a} ${x + 22} 50 Q ${x + 33} ${50 + a} ${x + 44} 50 `;
            x += 44;
          });
        }
        return `<svg class="ecg-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="الگوی تاکی‌آریتمی">
          ${svgGrid(w, h)}
          <path d="${path}" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>`;
      }

      function renderBradySVG(type) {
        const w = 560, h = 88;
        let path = 'M 0 58 ';
        if (type === 'sinus_brady') {
          [25, 210, 395].forEach((x) => {
            path += `L ${x} 58 Q ${x + 8} 45 ${x + 16} 58 L ${x + 28} 58 L ${x + 32} 16 L ${x + 37} 66 L ${x + 41} 58 Q ${x + 54} 42 ${x + 68} 58 `;
          });
        } else if (type === 'av1') {
          [20, 200, 380].forEach((x) => {
            path += `L ${x} 58 Q ${x + 8} 45 ${x + 16} 58 L ${x + 54} 58 L ${x + 58} 16 L ${x + 63} 66 L ${x + 67} 58 Q ${x + 80} 42 ${x + 94} 58 `;
          });
        } else if (type === 'mobitz1') {
          // Beat 1 short PR, Beat 2 medium PR, Beat 3 long PR, Beat 4 dropped
          const beats = [{ x: 15, pr: 24 }, { x: 145, pr: 44 }, { x: 295, pr: 66 }];
          beats.forEach((b) => {
            path += `L ${b.x} 58 Q ${b.x + 8} 45 ${b.x + 16} 58 L ${b.x + b.pr} 58 L ${b.x + b.pr + 4} 16 L ${b.x + b.pr + 9} 66 L ${b.x + b.pr + 13} 58 Q ${b.x + b.pr + 24} 44 ${b.x + b.pr + 36} 58 `;
          });
          // Dropped beat P wave only
          path += `L 470 58 Q 478 45 486 58 L 555 58`;
        } else if (type === 'mobitz2') {
          const beats = [20, 165, 310];
          beats.forEach((x, idx) => {
            path += `L ${x} 58 Q ${x + 8} 45 ${x + 16} 58 `;
            if (idx < 2) {
              path += `L ${x + 42} 58 L ${x + 46} 16 L ${x + 51} 66 L ${x + 55} 58 Q ${x + 68} 44 ${x + 80} 58 `;
            }
          });
          path += `L 455 58 Q 463 45 471 58 L 497 58 L 501 16 L 506 66 L 510 58 L 555 58`;
        } else {
          // 3rd degree: regular P waves at 30, 130, 230, 330, 430, 520; wide independent QRS at 85, 290, 485
          path = 'M 0 58 L 20 58 Q 28 45 36 58 L 75 58 L 85 18 L 102 74 L 112 58 L 122 58 Q 130 45 138 58 L 222 58 Q 230 45 238 58 L 280 58 L 290 18 L 307 74 L 317 58 L 325 58 Q 333 45 341 58 L 422 58 Q 430 45 438 58 L 475 58 L 485 18 L 502 74 L 512 58 L 520 58 Q 528 45 536 58 L 560 58';
        }
        return `<svg class="ecg-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="نمودار بلوک دهلیزی-بطنی">
          ${svgGrid(w, h)}
          <path d="${path}" fill="none" stroke="#0f172a" stroke-width="2.1" stroke-linejoin="round"/>
        </svg>`;
      }

      // Navigation & Core Rendering
      function goToScreen(index) {
        const safeIndex = Math.max(0, Math.min(SCREENS.length - 1, index));
        state.currentScreen = safeIndex;
        if (!state.visited.includes(safeIndex)) {
          state.visited.push(safeIndex);
        }
        saveState();
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderApp() {
        const screen = SCREENS[state.currentScreen];
        const headerTitle = document.getElementById('headerTitle');
        const stepCounter = document.getElementById('stepCounter');
        const progressFill = document.getElementById('progressFill');
        const bottomNav = document.getElementById('bottomNav');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const appMain = document.getElementById('appMain');

        headerTitle.textContent = screen.title;
        stepCounter.textContent = screen.short;

        const pct = Math.round((state.visited.length / SCREENS.length) * 100);
        progressFill.style.width = `${pct}%`;

        if (state.currentScreen === 0) {
          bottomNav.classList.add('hidden');
        } else {
          bottomNav.classList.remove('hidden');
          btnPrev.disabled = state.currentScreen <= 0;
          btnNext.disabled = state.currentScreen >= SCREENS.length - 1;
          btnNext.textContent = state.currentScreen === SCREENS.length - 2 ? 'مشاهده ارزیابی نهایی ←' : 'بعدی ←';
        }

        let html = '';
        switch (screen.id) {
          case 'start': html = renderStart(); break;
          case 'roadmap': html = renderRoadmap(); break;
          case 'rate': html = renderRate(); break;
          case 'tachy': html = renderTachy(); break;
          case 'brady': html = renderBrady(); break;
          case 'axis': html = renderAxis(); break;
          case 'intervals': html = renderIntervals(); break;
          case 'pwave': html = renderPWave(); break;
          case 'bbb': html = renderBBB(); break;
          case 'vh': html = renderVH(); break;
          case 'nsteacs': html = renderNSTEACS(); break;
          case 'stemi': html = renderSTEMI(); break;
          case 'quiz': html = renderQuiz(); break;
          case 'flashcards': html = renderFlashcards(); break;
          case 'summary': html = renderSummary(); break;
          default: html = renderStart();
        }

        appMain.innerHTML = `<div class="screen-animate">${html}</div>`;
      }

      function renderRoadmap() {
        const items = SCREENS.slice(2).map((s, idx) => {

          return `
            <button type="button" class="roadmap-item ${isDone ? 'done' : ''}" data-action="go" data-target="${realIdx}">
              <span class="roadmap-num">${isDone ? '✓' : idx + 1}</span>
              <span class="roadmap-info">
                <span class="roadmap-title">${s.title}</span>
                <span class="roadmap-sub">${isDone ? 'مشاهده‌شده' : 'آماده شروع'}</span>
              </span>
              <span style="color:var(--text-light);font-size:0.9rem;">←</span>
            </button>
          `;
        }).join('');

        return `
          <span class="eyebrow">مسیر آموزشی</span>
          <h2>نقشه راه ۷ گام تفسیر نوار قلب</h2>
          <p class="lead">برای یادگیری عمیق، مراحل را به ترتیب دنبال کنید یا مستقیماً وارد هر بخش شوید.</p>
          <div class="roadmap-list">${items}</div>
        `;
      }

      // 2. Step 1: Rate
      function renderRate() {
        const isRWave = state.rateMode === 'rwave';
        const bpm = isRWave ? Math.round(state.rateRWaves * 6) : Math.round(300 / state.rateBoxes);
        let statusClass = 'normal', statusText = 'ضربان نرمال (۶۰ تا ۱۰۰)';
        if (bpm > 100) { statusClass = 'tachy'; statusText = 'تاکی‌کاردی (> 100 bpm)'; }
        else if (bpm < 60) { statusClass = 'brady'; statusText = 'برادی‌کاردی (< 60 bpm)'; }

        return `
          <span class="eyebrow">گام ۱ از ۷ • Rate</span>
          <h2>محاسبه ضربان قلب</h2>
          <p class="lead">اولین گام، تشخیص سریع تاکی‌کاردی، برادی‌کاردی یا ضربان نرمال است. دو روش اصلی روی نوار ریتم وجود دارد:</p>

          <div class="grid-2" style="margin-bottom:16px;">
            <div class="card" style="margin-bottom:0;">
              <h3>۱. روش شمارش امواج <span class="en">R</span></h3>
              <p style="font-size:0.9rem;color:var(--text-muted);">تعداد امواج <span class="en">R</span> در نوار ریتم را بشمارید و در <strong>۶</strong> ضرب کنید.<br/>مثال: ۱۱ موج R × ۶ = <strong>۶۶ bpm</strong>.</p>
            </div>
            <div class="card" style="margin-bottom:0;">
              <h3>۲. روش مربع‌های بزرگ (۳۰۰)</h3>
              <p style="font-size:0.9rem;color:var(--text-muted);">عدد <strong>۳۰۰</strong> را بر تعداد مربع‌های بزرگ بین دو موج <span class="en">R</span> تقسیم کنید (هر ۱ مربع بزرگ = ۳۰۰ bpm).<br/>مثال: ۳۰۰ ÷ ۴/۵ ≈ <strong>۶۷ bpm</strong>.</p>
            </div>
          </div>

          <div class="card">
            <h3>شبیه‌ساز تعاملی محاسبه ضربان</h3>
            <div class="seg-tabs">
              <button type="button" class="seg-tab ${isRWave ? 'active' : ''}" data-action="rateMode" data-val="rwave">روش امواج R (×۶)</button>
              <button type="button" class="seg-tab ${!isRWave ? 'active' : ''}" data-action="rateMode" data-val="boxes">روش ۳۰۰ ÷ مربع بزرگ</button>
            </div>

            ${isRWave ? `
              <div class="slider-group">
                <div class="slider-header">
                  <span>تعداد امواج <span class="en">R</span> در نوار ریتم:</span>
                  <strong id="rateSliderLabel">${state.rateRWaves} موج (${state.rateRWaves} × ۶)</strong>
                </div>
                <input type="range" min="6" max="26" step="1" value="${state.rateRWaves}" data-input="rateRWaves" aria-label="تعداد امواج R" />
              </div>
            ` : `
              <div class="slider-group">
                <div class="slider-header">
                  <span>تعداد مربع‌های بزرگ بین دو موج <span class="en">R</span>:</span>
                  <strong id="rateSliderLabel">${state.rateBoxes} مربع (۳۰۰ ÷ ${state.rateBoxes})</strong>
                </div>
                <input type="range" min="1.5" max="7" step="0.5" value="${state.rateBoxes}" data-input="rateBoxes" aria-label="تعداد مربع‌های بزرگ" />
              </div>
            `}

            <div class="ecg-box">
              <div class="ecg-box-label">
                <span>نمای زنده نوار ریتم</span>
                <span class="en" id="rateSvgBpm">${bpm} bpm</span>
              </div>
              <div id="rateSvgWrap">${renderRateSVG(bpm)}</div>
            </div>

            <div class="metric-banner">
              <div>
                <div style="font-size:0.8rem;color:var(--text-light);">ضربان محاسبه‌شده</div>
                <div class="metric-value"><span class="en" id="rateMetricBpm">${bpm} bpm</span></div>
              </div>
              <span class="status-chip ${statusClass}" id="rateStatusChip">${statusText}</span>
            </div>
          </div>
        `;
      }

      // 3. Step 2A: Tachyarrhythmias
      function renderTachy() {
        const active = TACHY_DATA[state.tachyCell];
        const revealed = !!state.reveals['tachy_q'];

        return `
          <span class="eyebrow">گام ۲ از ۷ • Rhythm (تاکی‌کاردی)</span>
          <h2>طبقه‌بندی تاکی‌آریتمی‌ها (<span class="en">HR &gt; 100</span>)</h2>
          <p class="lead">برای تشخیص نوع تاکی‌آریتمی، دو سؤال کلیدی بپرسید: آیا <span class="en">QRS</span> باریک است (<span class="en">&lt;120 ms</span> / ۳ مربع کوچک) یا پهن؟ و آیا فاصله <span class="en">R–R</span> منظم است یا نامنظم؟</p>

          <div class="matrix-grid">
            <button type="button" class="matrix-btn ${state.tachyCell === 'narrow_reg' ? 'active' : ''}" data-action="tachyCell" data-val="narrow_reg">
              <strong>باریک و منظم</strong>
              <span>Narrow Regular</span>
            </button>
            <button type="button" class="matrix-btn ${state.tachyCell === 'narrow_irreg' ? 'active' : ''}" data-action="tachyCell" data-val="narrow_irreg">
              <strong>باریک و نامنظم</strong>
              <span>Narrow Irregular</span>
            </button>
            <button type="button" class="matrix-btn ${state.tachyCell === 'wide_reg' ? 'active' : ''}" data-action="tachyCell" data-val="wide_reg">
              <strong>پهن و منظم</strong>
              <span>Wide Regular</span>
            </button>
            <button type="button" class="matrix-btn ${state.tachyCell === 'wide_irreg' ? 'active' : ''}" data-action="tachyCell" data-val="wide_irreg">
              <strong>پهن و نامنظم</strong>
              <span>Wide Irregular</span>
            </button>
          </div>

          <div class="card">
            <h3>${active.title}</h3>
            <p style="font-size:0.88rem;color:var(--text-muted);margin-bottom:12px;">${active.criteria}</p>
            <div class="ecg-box">
              <div class="ecg-box-label"><span>الگوی شماتیک ریتم</span></div>
              ${renderTachySVG(active.svgType)}
            </div>
            <ul class="clean-list">
              ${active.items.map(it => `<li><strong>${it.name}:</strong> ${it.desc}</li>`).join('')}
            </ul>
          </div>

          <div class="reveal-box">
            <div class="reveal-q">تمرین بازیابی فعال: چه تفاوتی بین PSVT و فلاتر دهلیزی ۲ به ۱ در نوار قلب وجود دارد؟</div>
            <button type="button" class="btn btn-secondary" data-action="toggleReveal" data-val="tachy_q">
              ${revealed ? 'مخفی کردن پاسخ' : 'فکر کردم — نمایش پاسخ'}
            </button>
            ${revealed ? `<div class="reveal-a">در <strong>فلاتر دهلیزی ۲ به ۱</strong> امواج فلاتر منظم در لیدهای <span class="en">II, III, aVF</span> دیده می‌شوند و ضربان معمولاً ثابت روی حدود <strong>۱۵۰</strong> است. اما در <strong>PSVT</strong> نه موج P مشخصی هست و نه موج فلاتر، ضربان می‌تواند به ۱۷۰–۱۸۰ برسد و به مانورهای واگال یا <span class="en">Adenosine</span> پاسخ می‌دهد.</div>` : ''}
          </div>
        `;
      }

      // 4. Step 2B: Bradyarrhythmias
      function renderBrady() {
        const revealed = !!state.reveals['brady_q'];
        return `
          <span class="eyebrow">گام ۲ از ۷ • Rhythm (برادی‌کاردی)</span>
          <h2>برادی‌آریتمی‌ها و بلوک‌های <span class="en">AV</span> (<span class="en">HR &lt; 60</span>)</h2>
          <p class="lead">در ریتم کُند، اولین کار بررسی <strong>فاصله <span class="en">PR</span></strong> و ارتباط امواج <span class="en">P</span> با کمپلکس‌های <span class="en">QRS</span> است. روی هر مورد بزنید تا جزئیات و الگوی نوار آن باز شود:</p>

          <div>
            ${BRADY_DATA.map((item, idx) => {
              const isOpen = state.bradyOpen === idx;
              return `
                <div class="accordion-item ${isOpen ? 'open' : ''}">
                  <button type="button" class="accordion-trigger" data-action="bradyOpen" data-val="${idx}">
                    <div>
                      <div>${item.title}</div>
                      <span class="inline-tag">${item.badge}</span>
                    </div>
                    <span class="accordion-arrow">▼</span>
                  </button>
                  <div class="accordion-body">
                    <div class="ecg-box" style="margin-bottom:10px;">
                      ${renderBradySVG(item.svg)}
                    </div>
                    <p>${item.desc}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="reveal-box">
            <div class="reveal-q">تمرین سریع: جمله معروف «طولانی‌تر، طولانی‌تر، حذف!» (<span class="en">Longer, longer, drop</span>) مربوط به کدام بلوک است؟</div>
            <button type="button" class="btn btn-secondary" data-action="toggleReveal" data-val="brady_q">
              ${revealed ? 'مخفی کردن پاسخ' : 'نمایش پاسخ'}
            </button>
            ${revealed ? `<div class="reveal-a"><strong>بلوک AV درجه ۲ نوع موبیتز ۱ (ونکه‌باخ / <span class="en">Wenckebach</span>):</strong> فاصله PR به‌تدریج در هر ضربان افزایش می‌یابد تا یک کمپلکس QRS حذف شود.</div>` : ''}
          </div>
        `;
      }

      // 5. Step 3: Axis
      function renderAxis() {
        const l1 = state.axisLead1;
        const avf = state.axisAVF;
        const l2 = state.axisLead2;

        let resultTitle = '', resultTone = 'normal', resultNote = '', causes = [];

        if (l1 === 'up' && avf === 'up') {
          resultTitle = 'محور الکتریکی نرمال (Normal Axis)';
          resultTone = 'success';
          resultNote = 'هر دو شست (لید I و aVF) رو به بالا هستند؛ انحراف محور وجود ندارد.';
          causes = ['نوار طبیعی بدون انحراف محور الکتریکی.'];
        } else if (l1 === 'up' && avf === 'down') {
          if (l2 === 'pos') {
            resultTitle = 'محور الکتریکی نرمال (تأییدشده با لید II)';
            resultTone = 'success';
            resultNote = 'با وجود منفی بودن aVF، چون کمپلکس QRS در لید II عمدتاً مثبت است، محور همچنان در محدوده نرمال قرار دارد.';
            causes = ['بررسی لید II از تشخیص اشتباه انحراف به چپ جلوگیری کرد.'];
          } else {
            resultTitle = 'انحراف محور به چپ (Left Axis Deviation — LAD)';
            resultTone = 'warning';
            resultNote = 'لید I مثبت، aVF منفی و لید II منفی یا هم‌فاز (Equiphasic) است → LAD قطعی است.';
            causes = [
              'بلوک شاخه چپ (<span class="en">LBBB</span>)',
              'هیپرتروفی بطن چپ (<span class="en">LVH</span> — به‌دلیل کشیدگی و فشار روی شاخه چپ)',
              'بلوک فاسیکول قدامی چپ (<span class="en">Left Anterior Fascicular Block</span>)'
            ];
          }
        } else if (l1 === 'down' && avf === 'up') {
          resultTitle = 'انحراف محور به راست (Right Axis Deviation — RAD)';
          resultTone = 'warning';
          resultNote = 'شست راست (aVF) رو به بالا و شست چپ (I) رو به پایین است (شستی که بالاست جهت انحراف را نشان می‌دهد).';
          causes = [
            'بلوک شاخه راست (<span class="en">RBBB</span>)',
            'هیپرتروفی بطن راست (<span class="en">RVH</span>)',
            'بلوک فاسیکول خلفی چپ (<span class="en">Left Posterior Fascicular Block</span>)'
          ];
        } else {
          resultTitle = 'انحراف شدید محور به راست (Extreme Right Axis Deviation)';
          resultTone = 'danger';
          resultNote = 'هر دو شست رو به پایین هستند! پیش از هر چیز بررسی کنید آیا بیمار نبض دارد یا خیر.';
          causes = [
            'شایع‌ترین علت: تاکی‌کاردی بطنی منومورفیک (<span class="en">Monomorphic VTach</span>)',
            'همچنین در برخی انواع سندرم <span class="en">Wolff-Parkinson-White (WPW)</span>'
          ];
        }

        const showLead2 = (l1 === 'up' && avf === 'down');

        return `
          <span class="eyebrow">گام ۳ از ۷ • Axis</span>
          <h2>تعیین محور قلب با قانون شست‌ها</h2>
          <p class="lead">جهت غالب کمپلکس <span class="en">QRS</span> را در لید <strong><span class="en">I</span></strong> (شست دست چپ) و لید <strong><span class="en">aVF</span></strong> (شست دست راست) تغییر دهید و نتیجه را ببینید:</p>

          <div class="grid-2" style="margin-bottom:14px;">
            <div class="thumb-card">
              <div style="font-weight:700;">لید <span class="en">I</span> (شست چپ)</div>
              <div style="font-size:1.8rem;margin:6px 0;">${l1 === 'up' ? '👍' : '👎'}</div>
              <div class="thumb-toggle-row">
                <button type="button" class="thumb-btn ${l1 === 'up' ? 'active' : ''}" data-action="axisL1" data-val="up">مثبت (بالا)</button>
                <button type="button" class="thumb-btn ${l1 === 'down' ? 'active' : ''}" data-action="axisL1" data-val="down">منفی (پایین)</button>
              </div>
            </div>

            <div class="thumb-card">
              <div style="font-weight:700;">لید <span class="en">aVF</span> (شست راست)</div>
              <div style="font-size:1.8rem;margin:6px 0;">${avf === 'up' ? '👍' : '👎'}</div>
              <div class="thumb-toggle-row">
                <button type="button" class="thumb-btn ${avf === 'up' ? 'active' : ''}" data-action="axisAVF" data-val="up">مثبت (بالا)</button>
                <button type="button" class="thumb-btn ${avf === 'down' ? 'active' : ''}" data-action="axisAVF" data-val="down">منفی (پایین)</button>
              </div>
            </div>
          </div>

          ${showLead2 ? `
            <div class="card-soft">
              <div style="font-weight:700;font-size:0.92rem;margin-bottom:8px;">نکته کلیدی: برای افتراق محور نرمال از LAD، لید <span class="en">II</span> را هم چک کنید:</div>
              <div class="thumb-toggle-row">
                <button type="button" class="thumb-btn ${l2 === 'neg' ? 'active' : ''}" data-action="axisL2" data-val="neg">لید II منفی یا هم‌فاز</button>
                <button type="button" class="thumb-btn ${l2 === 'pos' ? 'active' : ''}" data-action="axisL2" data-val="pos">لید II عمدتاً مثبت</button>
              </div>
            </div>
          ` : ''}

          <div class="callout ${resultTone}">
            <span class="callout-title">${resultTitle}</span>
            <p style="margin-bottom:10px;">${resultNote}</p>
            <ul class="clean-list">
              ${causes.map(c => `<li>${c}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // 6. Step 4: Intervals
      function renderIntervals() {
        const isPR = state.intervalTab === 'pr';
        return `
          <span class="eyebrow">گام ۴ از ۷ • Intervals</span>
          <h2>بررسی فواصل <span class="en">PR</span> و <span class="en">QT</span></h2>
          <p class="lead">دو فاصله حیاتی که باید در هر نوار قلب ارزیابی شوند: فاصله <span class="en">PR</span> (بلوک‌های AV و WPW) و فاصله <span class="en">QT</span> (خطر تورساد).</p>

          <div class="seg-tabs">
            <button type="button" class="seg-tab ${isPR ? 'active' : ''}" data-action="intervalTab" data-val="pr">فاصله PR</button>
            <button type="button" class="seg-tab ${!isPR ? 'active' : ''}" data-action="intervalTab" data-val="qt">فاصله QT</button>
          </div>

          ${isPR ? `
            <div class="card">
              <div class="ecg-box">
                <div class="ecg-box-label"><span>مقایسه PR کوتاه + موج دلتا (WPW)</span></div>
                <svg class="ecg-svg" viewBox="0 0 560 100" role="img" aria-label="سه‌گانه WPW">
                  ${svgGrid(560, 100)}
                  <path d="M 10 68 L 60 68 Q 72 52 84 68 L 94 68 L 112 46 L 122 18 L 138 78 L 150 68 Q 170 50 190 68 L 260 68" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round"/>
                  <path d="M 94 68 L 112 46" stroke="#be123c" stroke-width="3.5"/>
                  <text x="115" y="42" fill="#be123c" font-size="12" font-weight="700">Delta Wave</text>
                  <line x1="60" y1="86" x2="94" y2="86" stroke="#0f4c81" stroke-width="2"/>
                  <text x="52" y="97" fill="#0f4c81" font-size="11" font-weight="700">Short PR</text>
                  <line x1="94" y1="86" x2="148" y2="86" stroke="#0d9488" stroke-width="2"/>
                  <text x="104" y="97" fill="#0d9488" font-size="11" font-weight="700">Wide QRS</text>
                </svg>
              </div>
              <ul class="clean-list">
                <li><strong>فاصله <span class="en">PR</span> طولانی (<span class="en">&gt; 200 ms</span>):</strong> مطرح‌کننده بلوک‌های دهلیزی-بطنی (درجه ۱، موبیتز ۱، موبیتز ۲ و درجه ۳ با گسستگی AV).</li>
                <li><strong>فاصله <span class="en">PR</span> کوتاه (<span class="en">&lt; 160 ms</span>):</strong> به <strong>سندرم <span class="en">Wolff-Parkinson-White (WPW)</span></strong> (مسیر فرعی <span class="en">Bundle of Kent</span>) فکر کنید و سه‌گانه زیر را جستجو کنید:
                  <br/>۱) فاصله <span class="en">PR</span> کوتاه، ۲) <strong>موج دلتا (<span class="en">Delta wave</span>)</strong> و ۳) کمپلکس <span class="en">QRS</span> پهن.
                </li>
              </ul>
            </div>
          ` : `
            <div class="card">
              <div class="callout danger" style="margin-bottom:14px;">
                <span class="callout-title">QT طولانی = خطر بالای <span class="en">Torsades de Pointes</span></span>
                قاعده سریع: اگر فاصله <span class="en">QT</span> (از شروع QRS تا پایان موج T) <strong>بیش از نصف فاصله <span class="en">R–R</span></strong> یا <strong>بیش از ۵۰۰ میلی‌ثانیه</strong> باشد، بیمار در خطر جدی تورساد است.
              </div>
              <h3>علل مهم طولانی شدن <span class="en">QT</span></h3>
              <ul class="clean-list" style="margin-bottom:14px;">
                <li><strong>داروهای ضدآریتمی:</strong> <span class="en">Amiodarone</span>، <span class="en">Ibutilide</span></li>
                <li><strong>آنتی‌بیوتیک‌ها:</strong> ماکرولیدها (<span class="en">Macrolides</span>)</li>
                <li><strong>آنتی‌سایکوتیک‌ها:</strong> <span class="en">Haloperidol</span>، <span class="en">Quetiapine</span></li>
                <li><strong>ضدافسردگی‌ها:</strong> <span class="en">SSRIs</span> و <span class="en">TCAs</span></li>
                <li><strong>ضدتهوع‌ها:</strong> <span class="en">Ondansetron</span>، <span class="en">Compazine</span></li>
                <li><strong>اختلالات الکترولیتی کلیدی:</strong> هیپوکالمی (<span class="en">Hypokalemia</span>)، هیپومنیزیمی (<span class="en">Hypomagnesemia</span>) و هیپوکلسمی (<span class="en">Hypocalcemia</span>).</li>
              </ul>
              <div class="card-soft" style="margin-bottom:0;">
                <strong>QT کوتاه</strong> (اهمیت کمتر، مثلاً زیر ۴۶۰ میلی‌ثانیه — افزایش مختصر خطر تاکی‌کاردی): در <strong>هیپرکلسمی (<span class="en">Hypercalcemia</span>)</strong> و <strong>هیپرکالمی (<span class="en">Hyperkalemia</span>)</strong> دیده می‌شود.
              </div>
            </div>
          `}
        `;
      }

      // 7. Step 5: P-Wave
      function renderPWave() {

          <div class="seg-tabs">

                <li><strong>علل بالینی:</strong> <strong>پرفشاری شریان ریوی (<span class="en">Pulmonary Hypertension</span>)</strong> و بیماری‌های دریچه تریکوسپید مانند <strong>تنگی تریکوسپید (<span class="en">Tricuspid Stenosis</span>)</strong>.</li>

      // 8. Step 6A: Bundle Branch Blocks
      function renderBBB() {
        const isLBBB = state.bbbTab === 'lbbb';
        return `
          <span class="eyebrow">گام ۶ از ۷ • QRS (بلوک شاخه‌ای)</span>
          <h2>بلوک شاخه چپ و راست (<span class="en">LBBB vs RBBB</span>)</h2>

            <button type="button" class="seg-tab ${!isLBBB ? 'active' : ''}" data-action="bbbTab" data-val="rbbb">بلوک شاخه راست (RBBB)</button>
          </div>

          <div class="card">
            <div class="grid-2" style="margin-bottom:14px;">
              <div class="ecg-box" style="margin-bottom:0;">
                <div class="ecg-box-label"><span>V1 / V2</span><span>${isLBBB ? 'موج S بسیار عمیق (rS)' : 'الگوی rSR\' (شکل M)'}</span></div>

                </svg>

              <div class="ecg-box" style="margin-bottom:0;">
                <div class="ecg-box-label"><span>V5 / V6</span><span>${isLBBB ? 'موج R بزرگ و دندانه‌دار' : 'موج S پهن و کشیده'}</span></div>
                <svg class="ecg-svg" viewBox="0 0 240 95" role="img" aria-label="الگوی V5-V6">
                  ${svgGrid(240, 95)}
                  ${isLBBB
                    ? `<path d="M 20 68 L 70 68 L 88 18 L 104 30 L 120 16 L 140 68 L 220 68" fill="none" stroke="#0f4c81" stroke-width="3" stroke-linejoin="round"/>`
                    : `<path d="M 20 55 L 65 55 L 74 62 L 86 18 L 102 74 L 138 74 L 152 55 L 220 55" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round"/>`

            ${isLBBB ? `

                <li><strong>V1 و V2:</strong> موج <span class="en">r</span> کوچک و سپس یک <strong>موج <span class="en">S</span> بسیار عمیق و بزرگ</strong>.</li>
                <li><strong>V5 و V6:</strong> یک <strong>موج <span class="en">R</span> بسیار بزرگ و دندانه‌دار (<span class="en">Notched R</span>)</strong>.</li>

              <ul class="clean-list">

      // 9. Step 6B: Ventricular Hypertrophy + Interactive Matching
      function renderVH() {
        const solvedCount = Object.keys(state.matching.solved).length;
        const leftOrder = [MATCHING_PAIRS[0], MATCHING_PAIRS[2], MATCHING_PAIRS[1], MATCHING_PAIRS[3]];
        const rightOrder = [MATCHING_PAIRS[1], MATCHING_PAIRS[3], MATCHING_PAIRS[0], MATCHING_PAIRS[2]];

        return `
          <span class="eyebrow">گام ۶ از ۷ • QRS (هیپرتروفی بطنی)</span>

          <div class="grid-2" style="margin-bottom:16px;">
            <div class="card" style="margin-bottom:0;">
              <h3>هیپرتروفی بطن چپ (<span class="en">LVH</span>)</h3>
              <ul class="clean-list">
                <li><strong>V1–V2:</strong> امواج <span class="en">S</span> به‌شدت عمیق.</li>
                <li><strong>V5–V6:</strong> امواج <span class="en">R</span> بسیار بلند.</li>
                <li><strong>معیار عددی:</strong> مجموع ارتفاع <span class="en">S</span> (در V1/V2) + <span class="en">R</span> (در V5/V6) <strong>بیش از ۳۵ میلی‌متر</strong>.</li>
                <li><strong>علل شایع:</strong> تنگی دریچه آئورت (<span class="en">Aortic Stenosis</span>) و فشار خون بالا (<span class="en">Hypertension</span>).</li>

            <div class="card" style="margin-bottom:0;">
              <h3>هیپرتروفی بطن راست (<span class="en">RVH</span>)</h3>

                <li><strong>V6:</strong> امواج <span class="en">S</span> بزرگ‌تر از حد معمول.</li>
                <li><strong>علت بسیار شایع:</strong> پرفشاری شریان ریوی (<span class="en">Pulmonary Hypertension</span>).</li>

          <div class="card">

                  const isSolved = !!state.matching.solved[item.id];
                  const isSel = state.matching.selectedLeft === item.id;

              <div class="match-col">

                  const isSolved = !!state.matching.solved[item.id];
                  return `<button type="button" class="match-item ${isSolved ? 'solved' : ''}" data-action="matchRight" data-val="${item.id}" ${isSolved ? 'disabled' : ''}>${isSolved ? '✓ ' : ''}${item.right}</button>`;

      // 10. Step 7A: ST Depression & NSTE-ACS
      function renderNSTEACS() {
        const m = state.stDepMorph;

        return `

                : 'افت <strong>افقی (<span class="en">Horizontal</span>)</strong> و <strong>نزولی (<span class="en">Downsloping</span>)</strong> همراه با وارونگی موج <span class="en">T</span> به‌شدت مطرح‌کننده ایسکمی میوکارد هستند.'}
            </p>
          </div>

            </div>
            <div class="card-soft" style="margin-bottom:0;font-size:0.88rem;">
              <strong>تشخیص‌های افتراقی مهم غیر از ACS:</strong> مسمومیت با <strong>دیگوکسین (<span class="en">Digoxin toxicity</span>)</strong> (سطح دیگوکسین را چک کنید) و <strong>هیپوکالمی (<span class="en">Hypokalemia</span>)</strong> (سطح پتاسیم را چک کنید).
            </div>
          </div>
        `;

      // 11. Step 7B: ST Elevation & STEMI Localization
      function renderSTEMI() {

            </div>
            <div class="card" style="margin-bottom:0;padding:14px;">
              <div style="font-weight:700;font-size:0.88rem;margin-bottom:6px;color:var(--danger);">محدب / سنگ‌قبر (Convex / Tombstone ☹️)</div>
              <svg class="ecg-svg" viewBox="0 0 220 74" role="img" aria-label="صعود محدب ST">

                <path d="M 10 52 L 55 52 L 64 16 Q 102 2 140 24 Q 158 52 175 52 L 210 52" fill="none" stroke="#be123c" stroke-width="2.8"/>
              </svg>
              <p style="font-size:0.8rem;color:var(--text-muted);margin-top:6px;">به‌شدت مطرح‌کننده انفارکتوس میوکارد (STEMI) — به‌ویژه همراه با تغییرات متقابل و تروپونین بالا.</p>
            </div>
          </div>

            <p style="font-size:0.84rem;color:var(--text-muted);margin-bottom:10px;">ابتدا همیشه STEMI را رد کنید، سپس به مقلدها (پریکاردیت و هیپرکالمی) فکر کنید:</p>
            <div class="territory-chips">
              ${Object.keys(STEMI_TERRITORIES).map(key => `
                <button type="button" class="chip-btn ${state.stemiTerritory === key ? 'active' : ''}" data-action="stemiTerr" data-val="${key}">

              `).join('')}
            </div>

            <div class="lead-grid">
              ${leads.map(ld => {
                const isSTE = terr.ste.includes(ld);
                const isRecip = terr.recip.includes(ld);
                return `<div class="lead-cell ${isSTE ? 'ste' : isRecip ? 'recip' : ''}">
                  <div>${ld}</div>
                  <div style="font-size:0.68rem;margin-top:2px;">${isSTE ? '↑ ST' : isRecip ? '↓ Recip' : '—'}</div>
                </div>`;
              }).join('')}
            </div>

            ${terr.posteriorNote ? `
              <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px;direction:ltr;">
                <span class="lead-cell ste" style="padding:6px 14px;">V7 ↑ ST</span>
                <span class="lead-cell ste" style="padding:6px 14px;">V8 ↑ ST</span>
                <span class="lead-cell ste" style="padding:6px 14px;">V9 ↑ ST</span>
              </div>
            ` : ''}

            <div class="callout ${state.stemiTerritory === 'pericarditis' || state.stemiTerritory === 'hyperk' ? 'warning' : 'danger'}" style="margin-bottom:0;">
              <span class="callout-title">${terr.title}</span>
              <p>${terr.desc}</p>
            </div>
          </div>
        `;
      }

      // 12. Quiz Screen
      function renderQuiz() {
        const answeredCount = Object.keys(state.quizAnswers).length;
        return `
          <span class="eyebrow">سنجش یادگیری • ${answeredCount} از ${QUIZ_QUESTIONS.length} پاسخ‌داده‌شده</span>
          <h2>آزمون سناریوهای بالینی و مفهومی</h2>
          <p class="lead">پس از هر انتخاب، بازخورد آموزشی آنی دریافت می‌کنید تا علت درستی یا نادرستی گزینه برایتان تثبیت شود.</p>

          ${QUIZ_QUESTIONS.map((q, qIdx) => {
            const userAns = state.quizAnswers[qIdx];
            const isAnswered = userAns !== undefined;
            return `
              <div class="card">
                <div style="font-size:0.78rem;font-weight:700;color:var(--teal);margin-bottom:6px;">سؤال ${qIdx + 1} • ${q.stepLabel}</div>
                <p style="font-weight:700;font-size:0.95rem;margin-bottom:12px;">${q.q}</p>
                <div>
                  ${q.options.map((opt, oIdx) => {
                    let cls = '';
                    if (isAnswered) {
                      if (oIdx === q.correct) cls = 'correct';
                      else if (oIdx === userAns) cls = 'incorrect';
                    }
                    return `
                      <button type="button" class="quiz-option ${cls}" data-action="quizAns" data-q="${qIdx}" data-o="${oIdx}" ${isAnswered ? 'disabled' : ''}>
                        <span>${opt}</span>
                        ${isAnswered && oIdx === q.correct ? '<span>✓</span>' : isAnswered && oIdx === userAns ? '<span>✕</span>' : ''}
                      </button>
                    `;
                  }).join('')}
                </div>
                ${isAnswered ? `
                  <div class="quiz-feedback ${userAns === q.correct ? 'correct' : 'incorrect'}">
                    <strong>${userAns === q.correct ? 'پاسخ درست:' : 'توضیح آموزشی:'}</strong> ${q.explain}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        `;
      }

      // 13. Flashcards Screen
      function renderFlashcards() {
        const filteredIndices = FLASHCARDS.map((_, i) => i).filter(i => {
          if (state.flashcardFilter === 'review') return state.flashcardStatus[i] === 'review';
          return true;
        });

        const safePos = filteredIndices.length > 0 ? Math.min(state.flashcardIndex, filteredIndices.length - 1) : 0;
        const actualIdx = filteredIndices[safePos];
        const card = actualIdx !== undefined ? FLASHCARDS[actualIdx] : null;
        const reviewCount = Object.values(state.flashcardStatus).filter(v => v === 'review').length;

        return `
          <span class="eyebrow">مرور فعال و تکرار فاصله‌دار</span>
          <h2>فلش‌کارت‌های مرور سریع</h2>
          <p class="lead">پیش از لمس کارت، پاسخ را در ذهن خود بازیابی کنید و سپس میزان تسلط خود را علامت بزنید.</p>

          <div class="seg-tabs">
            <button type="button" class="seg-tab ${state.flashcardFilter === 'all' ? 'active' : ''}" data-action="fcFilter" data-val="all">همه کارت‌ها (${FLASHCARDS.length})</button>
            <button type="button" class="seg-tab ${state.flashcardFilter === 'review' ? 'active' : ''}" data-action="fcFilter" data-val="review">نیاز به مرور (${reviewCount})</button>
          </div>

          ${!card ? `
            <div class="card" style="text-align:center;padding:32px 20px;">
              <h3>کارتی در لیست «نیاز به مرور» نیست!</h3>
              <p style="font-size:0.9rem;color:var(--text-muted);margin:8px 0 16px;">برای مرور مجدد همه مفاهیم، به نمای «همه کارت‌ها» برگردید.</p>
              <button type="button" class="btn btn-primary" data-action="fcFilter" data-val="all">نمایش همه کارت‌ها</button>
            </div>
          ` : `
            <div class="flashcard-stage" data-action="fcFlip" role="button" tabindex="0" aria-label="برگرداندن فلش‌کارت">
              <span class="flashcard-tag">${card.tag} • کارت ${safePos + 1} از ${filteredIndices.length}</span>
              <div class="flashcard-main" style="white-space:pre-line;">
                ${state.flashcardFlipped ? card.a : card.q}
              </div>
              <div class="flashcard-hint">${state.flashcardFlipped ? 'برای دیدن پرسش دوباره لمس کنید' : 'برای نمایش پاسخ لمس کنید'}</div>
            </div>

            <div style="display:flex;gap:10px;margin-bottom:12px;">
              <button type="button" class="btn btn-secondary" style="flex:1;border-color:var(--warning-border);color:var(--warning);" data-action="fcMark" data-idx="${actualIdx}" data-val="review">
                نیاز به مرور ${state.flashcardStatus[actualIdx] === 'review' ? '✓' : ''}
              </button>
              <button type="button" class="btn btn-secondary" style="flex:1;border-color:var(--success-border);color:var(--success);" data-action="fcMark" data-idx="${actualIdx}" data-val="known">
                تسلط دارم ${state.flashcardStatus[actualIdx] === 'known' ? '✓' : ''}
              </button>
            </div>

            <div style="display:flex;gap:10px;">
              <button type="button" class="btn btn-secondary" style="flex:1;" data-action="fcNav" data-dir="-1" ${safePos === 0 ? 'disabled' : ''}>→ کارت قبلی</button>
              <button type="button" class="btn btn-primary" style="flex:1;" data-action="fcNav" data-dir="1" ${safePos >= filteredIndices.length - 1 ? 'disabled' : ''}>کارت بعدی ←</button>
            </div>
          `}
        `;
      }

      // 14. Summary & Evaluation Screen
      function renderSummary() {
        let correct = 0;
        const weakSteps = [];
        const unanswered = [];

        QUIZ_QUESTIONS.forEach((q, idx) => {
          const ans = state.quizAnswers[idx];
          if (ans === undefined) {
            unanswered.push(q);
          } else if (ans === q.correct) {
            correct++;
          } else {
            weakSteps.push(q);
          }
        });

        const total = QUIZ_QUESTIONS.length;
        const pct = Math.round((correct / total) * 100);
        const knownCards = Object.values(state.flashcardStatus).filter(v => v === 'known').length;

        return `
          <span class="eyebrow">ارزیابی نهایی عملکرد</span>
          <h2>گزارش یادگیری و بخش‌های پیشنهادی برای مرور</h2>

          <div class="score-hero">
            <div class="score-circle">
              <span>${pct}٪</span>
              <small>${correct} از ${total}</small>
            </div>
            <h3>${pct >= 80 ? 'تسلط بسیار خوب بر رویکرد ۷ گام!' : pct >= 50 ? 'پیشرفت خوب — چند بخش نیاز به مرور دارد' : 'شروع عالی — مرور بخش‌های کلیدی توصیه می‌شود'}</h3>
            <p style="font-size:0.88rem;color:var(--text-muted);margin-top:6px;">
              بازدید صفحات: ${state.visited.length} از ${SCREENS.length} • فلش‌کارت‌های مسلط‌شده: ${knownCards} از ${FLASHCARDS.length}
            </p>
          </div>

          ${weakSteps.length > 0 ? `
            <div class="card">
              <h3>بخش‌هایی که در آزمون نیاز به مرور مجدد داشتند:</h3>
              <div class="roadmap-list" style="margin-top:10px;">
                ${weakSteps.map(w => {
                  const targetIdx = SCREENS.findIndex(s => s.id === w.stepId);
                  return `
                    <button type="button" class="roadmap-item" data-action="go" data-target="${targetIdx}">
                      <span class="roadmap-num" style="background:var(--danger-soft);color:var(--danger);">!</span>
                      <span class="roadmap-info">
                        <span class="roadmap-title">${w.stepLabel}</span>
                        <span class="roadmap-sub">برای مرور مجدد این بخش کلیک کنید</span>
                      </span>
                      <span>←</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          ` : unanswered.length > 0 ? `
            <div class="callout warning">
              <span class="callout-title">آزمون هنوز کامل نشده است</span>
              به ${unanswered.length} سؤال از آزمون پاسخ نداده‌اید. برای دریافت ارزیابی دقیق‌تر، به صفحه آزمون برگردید.
            </div>
          ` : `
            <div class="callout success">
              <span class="callout-title">همه سؤالات آزمون را درست پاسخ دادید!</span>
              برای تثبیت بلندمدت، می‌توانید هر چند روز یک‌بار فلش‌کارت‌های مرور سریع را دوره کنید.
            </div>
          `}

          <div class="card">
            <h3>خلاصه طلایی ۷ گام تفسیر <span class="en">ECG</span></h3>
            <ul class="clean-list">
              <li><strong>۱. Rate:</strong> امواج R × ۶ یا ۳۰۰ ÷ مربع بزرگ (نرمال ۶۰–۱۰۰).</li>
              <li><strong>۲. Rhythm:</strong> در تاکی‌کاردی ماتریس باریک/پهن × منظم/نامنظم؛ در برادی‌کاردی فاصله PR و بلوک‌های AV.</li>
              <li><strong>۳. Axis:</strong> قانون شست‌ها در I و aVF (تأیید LAD با لید II).</li>
              <li><strong>۴. Intervals:</strong> PR (بلوک AV یا سه‌گانه WPW) و QT (&gt; نصف R–R یا &gt;500 ms → خطر تورساد).</li>
              <li><strong>۵. P-Wave:</strong> دوشاخه در II + انتهایی بزرگ در V1 (LAE)؛ نوک‌تیز ≥2.5mm در II + ابتدایی بزرگ در V1 (RAE).</li>
              <li><strong>۶. QRS:</strong> بلوک شاخه‌ای (LBBB / RBBB) و هیپرتروفی بطنی (LVH / RVH).</li>
              <li><strong>۷. ST &amp; T:</strong> افت ST + تروپونین (آنژین ناپایدار vs NSTEMI)؛ صعود ST + محل STEMI (قُدامی، تحتانی، جانبی، خلفی) پیش از رد مقلدها.</li>
            </ul>
          </div>

          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button type="button" class="btn btn-primary" style="flex:1;" data-action="retryQuiz">تکرار آزمون</button>
            <button type="button" class="btn btn-danger-outline" style="flex:1;" data-action="openReset">شروع مجدد کل دوره</button>
          </div>
        `;
      }

      // Event Delegation
      document.addEventListener('click', function (e) {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const action = el.dataset.action;

        if (action === 'go') {
          goToScreen(parseInt(el.dataset.target, 10));
        } else if (action === 'rateMode') {
          state.rateMode = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'tachyCell') {
          state.tachyCell = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'toggleReveal') {
          const k = el.dataset.val;
          state.reveals[k] = !state.reveals[k];
          saveState();
          renderApp();
        } else if (action === 'bradyOpen') {
          const idx = parseInt(el.dataset.val, 10);
          state.bradyOpen = state.bradyOpen === idx ? -1 : idx;
          saveState();
          renderApp();
        } else if (action === 'axisL1') {
          state.axisLead1 = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'axisAVF') {
          state.axisAVF = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'axisL2') {
          state.axisLead2 = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'intervalTab') {
          state.intervalTab = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'pwaveTab') {
          state.pwaveTab = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'bbbTab') {
          state.bbbTab = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'matchLeft') {
          state.matching.selectedLeft = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'matchRight') {
          const left = state.matching.selectedLeft;
          const right = el.dataset.val;
          if (!left) {
            const fb = document.getElementById('matchFeedback');
            if (fb) {
              fb.style.color = 'var(--warning)';
              fb.textContent = 'ابتدا یک یافته را از ستون اول انتخاب کنید.';
            }
            return;
          }
          if (left === right) {
            state.matching.solved[left] = true;
            state.matching.selectedLeft = null;
            saveState();
            renderApp();
          } else {
            el.classList.add('wrong');
            const fb = document.getElementById('matchFeedback');
            if (fb) {
              fb.style.color = 'var(--danger)';
              fb.textContent = 'تطبیق نادرست بود؛ دوباره دقت کنید و گزینه صحیح را بزنید.';
            }
            setTimeout(() => el.classList.remove('wrong'), 450);
          }
        } else if (action === 'stDepMorph') {
          state.stDepMorph = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'tropState') {
          state.troponinState = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'stemiTerr') {
          state.stemiTerritory = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'quizAns') {
          const q = parseInt(el.dataset.q, 10);
          const o = parseInt(el.dataset.o, 10);
          if (state.quizAnswers[q] === undefined) {
            state.quizAnswers[q] = o;
            saveState();
            renderApp();
          }
        } else if (action === 'fcFilter') {
          state.flashcardFilter = el.dataset.val;
          state.flashcardIndex = 0;
          state.flashcardFlipped = false;
          saveState();
          renderApp();
        } else if (action === 'fcFlip') {
          state.flashcardFlipped = !state.flashcardFlipped;
          saveState();
          renderApp();
        } else if (action === 'fcMark') {
          const idx = parseInt(el.dataset.idx, 10);
          state.flashcardStatus[idx] = el.dataset.val;
          saveState();
          renderApp();
        } else if (action === 'fcNav') {
          const dir = parseInt(el.dataset.dir, 10);
          state.flashcardIndex = Math.max(0, state.flashcardIndex + dir);
          state.flashcardFlipped = false;
          saveState();
          renderApp();
        } else if (action === 'retryQuiz') {
          state.quizAnswers = {};
          saveState();
          goToScreen(SCREENS.findIndex(s => s.id === 'quiz'));
        } else if (action === 'openReset') {
          document.getElementById('resetModal').classList.remove('hidden');
        }
      });

      function updateRateDisplayInPlace() {
        const isRWave = state.rateMode === 'rwave';
        const bpm = isRWave ? Math.round(state.rateRWaves * 6) : Math.round(300 / state.rateBoxes);
        let statusClass = 'normal', statusText = 'ضربان نرمال (۶۰ تا ۱۰۰)';
        if (bpm > 100) { statusClass = 'tachy'; statusText = 'تاکی‌کاردی (> 100 bpm)'; }
        else if (bpm < 60) { statusClass = 'brady'; statusText = 'برادی‌کاردی (< 60 bpm)'; }
        const lbl = document.getElementById('rateSliderLabel');
        const svgBpm = document.getElementById('rateSvgBpm');
        const svgWrap = document.getElementById('rateSvgWrap');
        const metricBpm = document.getElementById('rateMetricBpm');
        const chip = document.getElementById('rateStatusChip');
        if (lbl) lbl.textContent = isRWave ? `${state.rateRWaves} موج (${state.rateRWaves} × ۶)` : `${state.rateBoxes} مربع (۳۰۰ ÷ ${state.rateBoxes})`;
        if (svgBpm) svgBpm.textContent = `${bpm} bpm`;
        if (svgWrap) svgWrap.innerHTML = renderRateSVG(bpm);
        if (metricBpm) metricBpm.textContent = `${bpm} bpm`;
        if (chip) {
          chip.className = 'status-chip ' + statusClass;
          chip.textContent = statusText;
        }
      }

      document.addEventListener('input', function (e) {
        const inputType = e.target.dataset.input;
        if (!inputType) return;
        if (inputType === 'rateRWaves') {
          state.rateRWaves = parseInt(e.target.value, 10);
          saveState();
          updateRateDisplayInPlace();
        } else if (inputType === 'rateBoxes') {
          state.rateBoxes = parseFloat(e.target.value);
          saveState();
          updateRateDisplayInPlace();
        }
      });

      // Fixed controls
      document.getElementById('btnRoadmap').addEventListener('click', function () {
        goToScreen(1);
      });

      document.getElementById('btnPrev').addEventListener('click', function () {
        goToScreen(state.currentScreen - 1);
      });

      document.getElementById('btnNext').addEventListener('click', function () {
        goToScreen(state.currentScreen + 1);
      });

      document.getElementById('btnCancelReset').addEventListener('click', function () {
        document.getElementById('resetModal').classList.add('hidden');
      });

      document.getElementById('btnConfirmReset').addEventListener('click', function () {
        state = getDefaultState();
        saveState();
        document.getElementById('resetModal').classList.add('hidden');
        renderApp();
      });

      // Initial render
      renderApp();
    })();
  </script>
</body>
</html>
