<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معمای شکمِ متورم | A Swell Diagnosis — کیس تعاملی NEJM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f1d3a;
      --navy-2: #182b52;
      --accent: #e8742c;
      --accent-soft: rgba(232, 116, 44, 0.12);
      --teal: #0d9488;
      --teal-soft: rgba(13, 148, 136, 0.12);
      --crimson: #dc2626;
      --crimson-soft: rgba(220, 38, 38, 0.11);
      --emerald: #059669;
      --emerald-soft: rgba(5, 150, 105, 0.12);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.12);
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #526075;
      --fig: #f5f7fb;
      --shadow: 0 10px 30px -12px rgba(15, 29, 58, 0.12);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --navy: #0a1224;
      --navy-2: #162442;
      --accent: #f2843f;
      --accent-soft: rgba(242, 132, 63, 0.16);
      --teal: #2dd4bf;
      --teal-soft: rgba(45, 212, 191, 0.14);
      --crimson: #f87171;
      --crimson-soft: rgba(248, 113, 113, 0.15);
      --emerald: #34d399;
      --emerald-soft: rgba(52, 211, 153, 0.15);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.15);
      --bg: #0b1220;
      --surface: #121c30;
      --surface-2: #17233b;
      --border: #253451;
      --text: #e8eef8;
      --text-muted: #9fb0cc;
      --fig: #f5f7fb;
      --shadow: 0 14px 36px -14px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Vazirmatn', Tahoma, system-ui, sans-serif;
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .en {
      font-family: 'Inter', system-ui, sans-serif;
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Sticky Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--navy);
      color: #fff;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 4px 18px rgba(0,0,0,0.2);
    }
    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #f59e0b);
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(232,116,44,0.35);
    }
    .brand-text h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      color: #fff;
    }
    .brand-text p {
      margin: 0;
      font-size: 11px;
      color: #b7c6e0;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .top-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 6px 11px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .top-btn:hover { background: rgba(255,255,255,0.2); }
    .top-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .badge-count {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .top-btn.active .badge-count { background: var(--navy); }
    .mobile-drawer-btn { display: none; }

    /* Story Stepper Bar */
    .stepper-wrap {
      max-width: 1240px;
      margin: 14px auto 0;
      padding: 0 16px;
    }
    .stepper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      scrollbar-width: thin;
    }
    .step-pill {
      flex: 1 0 auto;
      min-width: 132px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      color: var(--text);
      text-align: right;
      transition: all 0.2s ease;
    }
    .step-pill:hover:not(.locked) {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .step-pill.current {
      background: var(--navy);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 6px 16px rgba(15,29,58,0.22);
    }
    .step-pill.done:not(.current) {
      border-color: var(--emerald);
      background: var(--emerald-soft);
    }
    .step-pill.locked {
      opacity: 0.52;
      cursor: not-allowed;
    }
    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .step-pill.current .step-num { background: var(--accent); color: #fff; }
    .step-pill.done:not(.current) .step-num { background: var(--emerald); color: #fff; }
    .step-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }
    .step-label { font-size: 11px; opacity: 0.78; }
    .step-title { font-size: 12px; font-weight: 700; white-space: nowrap; }

    /* Main Grid */
    .layout {
      max-width: 1240px;
      margin: 12px auto 40px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 20px;
      align-items: start;
    }

    /* Main Story Card */
    .story-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: fadeSlide 0.3s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chapter-hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      color: #fff;
      padding: 22px 24px 20px;
      position: relative;
      border-bottom: 3px solid var(--accent);
    }
    .chapter-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .chapter-tag {
      background: var(--accent);
      color: #fff;
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .time-badge {
      background: rgba(255,255,255,0.14);
      color: #e2e8f0;
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .chapter-hero h2 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.4;
    }
    .chapter-hero p {
      margin: 0;
      font-size: 14px;
      color: #cbd5e1;
    }

    .story-body {
      padding: 22px 24px 26px;
    }

    /* Narrative Box */
    .narrative {
      background: var(--surface-2);
      border-right: 4px solid var(--accent);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 20px;
      font-size: 15px;
    }
    .narrative p { margin: 0 0 10px; }
    .narrative p:last-child { margin-bottom: 0; }

    .detective-note {
      background: var(--accent-soft);
      border: 1px solid rgba(232,116,44,0.3);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 16px 0;
      font-size: 14px;
    }
    .detective-note strong { color: var(--accent); }

    .clue-reveal-card {
      background: linear-gradient(135deg, rgba(13,148,136,0.1), rgba(15,29,58,0.06));
      border: 1.5px dashed var(--teal);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 16px 0;
    }
    .clue-reveal-card .clue-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 800;
      color: var(--teal);
      margin-bottom: 6px;
    }

    /* Interactive Grids & Panels */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .info-tile {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .info-tile .tile-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .info-tile .tile-val {
      font-size: 16px;
      font-weight: 800;
      margin-top: 2px;
    }
    .info-tile .tile-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .tile-alert { border-color: var(--crimson); background: var(--crimson-soft); }
    .tile-ok { border-color: var(--emerald); background: var(--emerald-soft); }
    .tile-warn { border-color: var(--amber); background: var(--amber-soft); }

    /* Sub-tabs inside chapters */
    .subtabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0 12px;
    }
    .subtab-btn {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .subtab-btn.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--accent);
    }

    /* Interactive Mimic Cards (Chapter 3) */
    .mimic-card {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: right;
      font-family: inherit;
      color: var(--text);
      width: 100%;
    }
    .mimic-card:hover { border-color: var(--accent); }
    .mimic-card.inspected {
      border-color: var(--crimson);
      background: var(--crimson-soft);
    }
    .mimic-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
    }
    .mimic-detail {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    /* Interactive CT Viewer (Chapter 5) */
    .ct-shell {
      background: #0d1321;
      border-radius: 14px;
      padding: 16px;
      color: #fff;
      margin: 16px 0;
      border: 1px solid #263450;
    }
    .ct-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .ct-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .ct-btn.active { background: var(--accent); border-color: var(--accent); }
    .ct-stage {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .ct-img-wrap {
      position: relative;
      transition: transform 0.3s ease;
      transform-origin: center center;
    }
    .ct-img-wrap.zoomed { transform: scale(1.38); }
    .ct-img-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hotspot {
      position: absolute;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: 2px solid #fff;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 0 0 4px rgba(232,116,44,0.35);
      animation: pulsePin 1.8s infinite;
      z-index: 3;
    }
    .hotspot.selected {
      background: #10b981;
      box-shadow: 0 0 0 5px rgba(16,185,129,0.45);
    }
    @keyframes pulsePin {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .ct-caption {
      margin-top: 12px;
      background: rgba(255,255,255,0.08);
      border-right: 3px solid var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #e2e8f0;
    }

    /* Lab Range Bars (Chapter 6) */
    .lab-bar-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .lab-bar-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .lab-track {
      position: relative;
      height: 14px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    [data-theme="dark"] .lab-track { background: #263450; }
    .lab-normal-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(5,150,105,0.28);
      border-left: 2px dashed var(--emerald);
      border-right: 2px dashed var(--emerald);
    }
    .lab-marker {
      position: absolute;
      top: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--crimson);
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Interactive Pathway SVG Box */
    .pathway-box {
      background: var(--fig);
      color: #1e293b;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin: 18px 0;
    }
    .pathway-explain {
      margin-top: 12px;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-right: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13.5px;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      margin: 14px 0;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }
    th {
      background: var(--navy);
      color: #fff;
      font-weight: 700;
    }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: var(--surface-2); }

    /* Checkpoint Quiz Box */
    .quiz-box {
      margin-top: 22px;
      background: var(--surface-2);
      border: 2px solid var(--navy-2);
      border-radius: 14px;
      padding: 18px;
    }
    .quiz-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--navy);
      color: #fff;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .quiz-q {
      font-size: 15px;
      font-weight: 800;
      margin: 0 0 12px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .quiz-opt {
      width: 100%;
      text-align: right;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.18s ease;
    }
    .quiz-opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .quiz-opt.correct {
      border-color: var(--emerald);
      background: var(--emerald-soft);
    }
    .quiz-opt.wrong {
      border-color: var(--crimson);
      background: var(--crimson-soft);
    }
    .opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .quiz-feedback {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      display: none;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.ok {
      background: var(--emerald-soft);
      border-right: 4px solid var(--emerald);
    }
    .quiz-feedback.bad {
      background: var(--amber-soft);
      border-right: 4px solid var(--amber);
    }

    /* Story Footer Navigation */
    .story-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: var(--surface-2);
      border-top: 1px solid var(--border);
    }
    .nav-btn {
      padding: 10px 18px;
      border-radius: 11px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); }
    .nav-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .nav-btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
    .nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Sidebar (Detective Board) */
    .sidebar {
      position: sticky;
      top: 72px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .side-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--navy);
    }
    .side-tab {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 12px 8px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .side-tab.active {
      color: #fff;
      border-bottom-color: var(--accent);
      background: rgba(255,255,255,0.06);
    }
    .side-content {
      padding: 14px;
      max-height: calc(100vh - 150px);
      overflow-y: auto;
    }
    .ddx-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 8px;
      background: var(--surface-2);
      transition: all 0.2s;
    }
    .ddx-item.confirmed {
      border-color: var(--emerald);
      background: var(--emerald-soft);
    }
    .ddx-item.high {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .ddx-item.ruled_out { opacity: 0.62; }
    .ddx-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 800;
    }
    .ddx-pill {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }
    .st-active { background: var(--amber-soft); color: var(--amber); }
    .st-low { background: rgba(100,116,139,0.16); color: var(--text-muted); }
    .st-ruled_out { background: var(--crimson-soft); color: var(--crimson); text-decoration: line-through; }
    .st-high { background: var(--accent); color: #fff; }
    .st-confirmed { background: var(--emerald); color: #fff; }
    .ddx-reason {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .clue-item {
      border: 1px solid var(--border);
      border-right: 3.5px solid var(--teal);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 9px;
      background: var(--surface-2);
      font-size: 12.5px;
    }
    .clue-item.locked {
      border-right-color: var(--border);
      opacity: 0.55;
      font-style: italic;
    }

    .score-card {
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      color: #fff;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin-top: 18px;
      border: 2px solid var(--accent);
    }
    .score-num {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1.2;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--navy);
      color: #fff;
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 26px rgba(0,0,0,0.3);
      z-index: 60;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Mobile Drawer Backdrop */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 45;
    }
    .drawer-backdrop.open { display: block; }

          ans: 1,
          exp: 'درست است! اریتما مارژیناتوم (راش مارپیچی/سرپیژینوس) در نیمی از بیماران به عنوان علامت هشداردهنده پیش از حمله رخ می‌دهد و چون شبیه کهیر به نظر می‌رسد، اغلب باعث تاخیر در تشخیص HAE (که به طور میانگین ۸.۶ سال است) می‌شود.'
        },
        {
          id: 'q3',
          q: '۳. در میان درمان‌های خط اول حمله حاد (On-demand) در HAE، کدام دارو به دلیل خطر تا ۴٪ آنافیلاکسی باید حتماً تحت نظارت کادر درمان تزریق شود؟',
          opts: [
            'ایکاتیبانت (Icatibant — آنتاگونیست گیرنده B2 برادی‌کینین)',
            'کنسانتره C1-INH مشتق از پلاسما یا نوترکیب انسانی',
            'اکالانتاید (Ecallantide — مهارکننده کالیکرئین)'
          ],
          ans: 2,
          exp: 'کاملاً درست! سه داروی اول (C1-INH مشتق از پلاسما، نوترکیب انسانی و ایکاتیبانت) می‌توانند توسط خود بیمار تزریق شوند، اما اکالانتاید (Ecallantide) تا ۴٪ خطر آنافیلاکسی دارد و نیازمند حضور تیم درمان است.'
        },
        {
          id: 'q4',
          q: '۴. برای پروفیلاکسی پیش از اقدامات تهاجمی (مثل جراحی دندان، لوله‌گذاری یا آندوسکوپی) در بیمار HAE، در صورت استفاده از آندروژن آنابولیک (مانند دانازول) رژیم توصیه‌شده کدام است؟',
          opts: [
            'شروع ۵ روز قبل از پروسیجر و ادامه به مدت ۲ تا ۵ روز پس از آن',
            'تک‌دوز دقیقاً ۳۰ دقیقه قبل از پروسیجر',
            'فقط پس از بروز تورم حنجره تجویز می‌شود'
          ],
          ans: 0,
          exp: 'آفرین! علاوه بر تزریق وریدی کنسانتره C1-INH قبل از پروسیجر، می‌توان دانازول یا استانوزولول را ۵ روز قبل شروع کرد و ۲ تا ۵ روز بعد ادامه داد تا به طور موقت سطح C1-INH و C4 افزایش یابد (FFP گزینه خط دوم است).'
        }
      ];

      // App State
      let state = {
        currentStep: 0,
        unlockedStep: 0,
        freeExplore: false,
        darkMode: false,
        sideTab: 'ddx',
        checkpoints: {}, // chapterId -> chosenIndex
        exam: {},        // qId -> chosenIndex
        ch2Tab: 'vitals',
        inspectedMimics: {},
        ch4Filter: 'all',
        ctPanel: 'A',
        ctZoom: false,
        activeHotspot: 'A1',
        pathwayMode: 'attack'
      };

      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = Object.assign(state, parsed);
        }
      } catch (e) {}

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
      }

      function applyTheme() {
        document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
        const btn = document.getElementById('btnTheme');
        btn.textContent = state.darkMode ? '☀️ حالت روز' : '🌙 حالت شب';
      }

      function getEffectiveMaxStep() {
        return state.freeExplore ? CHAPTERS.length - 1 : state.unlockedStep;
      }

      function getUnlockedClueCount() {
        const maxS = Math.max(state.currentStep, state.unlockedStep);
        return CLUES.filter(c => c.minStep <= maxS).length;
      }

      function renderStepper() {
        const stepper = document.getElementById('stepper');
        const maxAllowed = getEffectiveMaxStep();
        stepper.innerHTML = CHAPTERS.map((ch, idx) => {
          const isCurrent = idx === state.currentStep;
          const isLocked = idx > maxAllowed;
          const isDone = idx < state.unlockedStep || (idx === 5 && state.unlockedStep >= 6) || (idx === 6 && Object.keys(state.exam).length === FINAL_EXAM.length);
          const cls = ['step-pill', isCurrent ? 'current' : '', isDone ? 'done' : '', isLocked ? 'locked' : ''].join(' ');
          return `
            <button type="button" class="${cls}" data-step="${idx}" ${isLocked ? 'disabled' : ''}>
              <span class="step-num">${isLocked ? '🔒' : (isDone && !isCurrent ? '✓' : (idx + 1).toLocaleString('fa-IR'))}</span>
              <span class="step-meta">
                <span class="step-label">فصل ${(idx + 1).toLocaleString('fa-IR')}</span>
                <span class="step-title">${ch.short}</span>
              </span>
            </button>
          `;
        }).join('');

        stepper.querySelectorAll('.step-pill:not(:disabled)').forEach(btn => {
          btn.addEventListener('click', () => {
            state.currentStep = Number(btn.dataset.step);
            saveState();
            renderAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
      }

      function renderSidebar() {
        const count = getUnlockedClueCount();
        document.getElementById('clueCountSide').textContent = count.toLocaleString('fa-IR');
        document.getElementById('clueCountMobile').textContent = `${count.toLocaleString('fa-IR')}/۶`;

        document.getElementById('tabDdx').classList.toggle('active', state.sideTab === 'ddx');
        document.getElementById('tabClues').classList.toggle('active', state.sideTab === 'clues');

        const box = document.getElementById('sideContent');
        if (state.sideTab === 'ddx') {
          const statusLabels = {
            active: { txt: 'مطرح', cls: 'st-active' },
            low: { txt: 'کم‌احتمال', cls: 'st-low' },
            ruled_out: { txt: 'رد شد', cls: 'st-ruled_out' },
            high: { txt: 'مظنون اصلی!', cls: 'st-high' },
            confirmed: { txt: 'تشخیص قطعی ✓', cls: 'st-confirmed' }
          };
          // Sort so confirmed/high/active float to top
          const order = { confirmed: 0, high: 1, active: 2, low: 3, ruled_out: 4 };
          const sorted = [...DDX_LIST].sort((a, b) => {
            const sa = a.states[state.currentStep].s;
            const sb = b.states[state.currentStep].s;
            return order[sa] - order[sb];
          });
          box.innerHTML = `
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">
              وضعیت تشخیص‌های افتراقی در <strong>فصل ${(state.currentStep + 1).toLocaleString('fa-IR')}</strong> (به‌روزرسانی خودکار با پیشرفت داستان):
            </div>
            ${sorted.map(item => {
              const cur = item.states[state.currentStep];
              const meta = statusLabels[cur.s];
              return `
                <div class="ddx-item ${cur.s}">
                  <div class="ddx-top">
                    <span>${item.name}</span>
                    <span class="ddx-pill ${meta.cls}">${meta.txt}</span>
                  </div>
                  <div style="font-size:11px;color:var(--text-muted);"><span class="en">${item.en}</span></div>
                  <div class="ddx-reason">${cur.r}</div>
                </div>
              `;
            }).join('')}
          `;
        } else {
          const maxS = Math.max(state.currentStep, state.unlockedStep);
          box.innerHTML = `
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">
              سرنخ‌های جمع‌آوری‌شده در پرونده بیمار تا اینجا:
            </div>
            ${CLUES.map(clue => {
              const unlocked = clue.minStep <= maxS || state.freeExplore;
              if (!unlocked) {
                return `
                  <div class="clue-item locked">
                    🔒 سرنخ ${(clue.id + 1).toLocaleString('fa-IR')} هنوز کشف نشده — به پیشروی در داستان ادامه بده!
                  </div>
                `;
              }
              return `
                <div class="clue-item">
                  <div style="font-weight:800;color:var(--teal);margin-bottom:4px;">${clue.title}</div>
                  <div>${clue.text}</div>
                </div>
              `;
            }).join('')}
          `;
        }
      }

      function renderCheckpoint(chapterId, question, options, correctIdx, explanation) {
        const chosen = state.checkpoints[chapterId];
        const answered = chosen !== undefined;
        const letters = ['الف', 'ب', 'ج'];
        return `
          <div class="quiz-box" data-checkpoint="${chapterId}">
            <div class="quiz-badge">🕵 ایستگاه تصمیم‌گیری بالینی — برای باز کردن فصل بعد پاسخ بده</div>
            <p class="quiz-q">${question}</p>
            <div class="quiz-options">
              ${options.map((opt, idx) => {
                let cls = 'quiz-opt';
                if (answered) {
                  if (idx === correctIdx) cls += ' correct';
                  else if (idx === chosen) cls += ' wrong';
                }
                return `
                  <button type="button" class="${cls}" data-opt="${idx}">
                    <span class="opt-letter">${letters[idx]}</span>
                    <span>${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>
            <div class="quiz-feedback ${answered ? ('show ' + (chosen === correctIdx ? 'ok' : 'bad')) : ''}">
              ${answered ? `<strong>${chosen === correctIdx ? '✅ دقیقاً همین‌طوره!' : '💡 نکته کارآگاهی:'}</strong> ${explanation}` : ''}
            </div>
          </div>
        `;
      }

      function renderChapter() {
        const ch = CHAPTERS[state.currentStep];
        const hero = document.getElementById('chapterHero');

          { t: 'زنگ خطر در اورژانس: درد شکم ناگهانی در جوان ۱۹ ساله', sub: 'یک جوان کاملاً سالم یک ساعت پیش ناگهان دچار درد شدید و منتشر شکم شده است...' },
          { t: 'معاینه بالینی و آزمایش‌های گمراه‌کننده', sub: 'درد شدید است، اما شکم نرم و آزمایش‌ها کاملاً عادی! این تناقض چه پیامی دارد؟' },

              <div class="info-tile tile-alert">
                <div class="tile-label">خطر ادم حنجره</div>
                <div class="tile-val">۰.۹٪ حملات</div>
                <div class="tile-sub">می‌تواند تهدیدکننده حیات باشد و به خفگی و مرگ منجر شود.</div>
              </div>
              <div class="info-tile">
                <div class="tile-label">سن شروع و محرک‌ها</div>
                <div class="tile-val">۸ تا ۱۲ سالگی</div>
                <div class="tile-sub">اغلب در بلوغ تشدید می‌شود • محرک: استرس، تروما، عفونت، ورزش، جراحی</div>
              </div>
            </div>

            <div class="clue-reveal-card" style="border-color:var(--emerald);background:var(--emerald-soft);">
              <div class="clue-head" style="color:var(--emerald);">
                <span>💊 درمان و سرانجام بیمار (پیگیری ۶ ماهه)</span>
                <span class="en" style="font-size:12px;">Danazol 200 mg Weekly</span>
              </div>
              <div>
                به دلیل محدودیت‌های مالی، داروهای خط اول (<span class="en">Plasma-derived / Recombinant C1-INH</span>، <span class="en">Ecallantide</span>، <span class="en">Icatibant</span> و <span class="en">Lanadelumab</span>) در دسترس بیمار نبودند. بنابراین <strong>دانازول (<span class="en">Danazol</span>) با دوز ۲۰۰ میلی‌گرم هفته‌ای یک‌بار</strong> شروع شد (با پایش عوارض آندروژنی: افزایش وزن، آکنه، هیرسوتیسم، سردرد، فلاشینگ، فشار خون و دیس‌لیپیدمی).<br/>
                <strong>نتیجه شگفت‌انگیز:</strong> در پیگیری <strong>۶ ماهه</strong>، بیمار <strong>هیچ حمله دیگری</strong> را تجربه نکرد! 🎉
              </div>
            </div>
          `;
          // Auto-unlock final exam once user reaches chapter 6
          if (state.unlockedStep < 6) {
            state.unlockedStep = 6;
            saveState();
          }
        } else if (state.currentStep === 6) {
          const letters = ['الف', 'ب', 'ج'];
          const answeredCount = Object.keys(state.exam).length;
          let correctCount = 0;
          FINAL_EXAM.forEach(item => {
            if (state.exam[item.id] === item.ans) correctCount++;
          });
          const rank = correctCount === 4 ? '🏆 کارآگاه ارشد بالینی (Senior Diagnostician)' :
                       correctCount >= 3 ? '🩺 کارآگاه تیزبین (Sharp Clinician)' :
                       '🔍 کارآموز پیگیر (Keep Exploring!)';

          body.innerHTML = `
            <p style="margin-top:0;font-size:14.5px;">به ایستگاه آخر رسیدی! این ۴ سوال مستقیماً از نکات بالینی و تفسیری مقاله <span class="en">A Swell Diagnosis</span> طراحی شده‌اند تا مطمئن شوی هیچ نکته‌ای از <span class="en">HAE</span> از دستت درنرفته است.</p>

            ${FINAL_EXAM.map(item => {
              const chosen = state.exam[item.id];
              const isAns = chosen !== undefined;
              return `
                <div class="quiz-box" style="margin-top:14px;" data-exam="${item.id}">
                  <p class="quiz-q">${item.q}</p>
                  <div class="quiz-options">
                    ${item.opts.map((opt, idx) => {
                      let cls = 'quiz-opt';
                      if (isAns) {
                        if (idx === item.ans) cls += ' correct';
                        else if (idx === chosen) cls += ' wrong';
                      }
                      return `
                        <button type="button" class="${cls}" data-exam-opt="${idx}">
                          <span class="opt-letter">${letters[idx]}</span>
                          <span>${opt}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                  <div class="quiz-feedback ${isAns ? ('show ' + (chosen === item.ans ? 'ok' : 'bad')) : ''}">
                    ${isAns ? `<strong>${chosen === item.ans ? '✅ پاسخ درست!' : '📌 نکته کلیدی:'}</strong> ${item.exp}` : ''}
                  </div>
                </div>
              `;
            }).join('')}

            ${answeredCount === FINAL_EXAM.length ? `
              <div class="score-card" id="scoreCard">
                <div style="font-size:13px;color:#cbd5e1;">کارنامه نهایی پرونده «معمای شکمِ متورم»</div>
                <div class="score-num">${correctCount.toLocaleString('fa-IR')} از ۴</div>
                <div style="font-size:16px;font-weight:800;margin:6px 0 10px;">${rank}</div>
                <div style="font-size:13px;color:#cbd5e1;max-width:520px;margin:0 auto 14px;">
                  پیام کلیدی مقاله <span class="en">NEJM</span>: در هر بیمار با حملات مکرر درد شدید شکم و بررسی‌های منفی، کافی است <strong>به آنژیوادم ارثی فکر کنیم</strong>!
                </div>
                <button type="button" id="btnReplayEnd" class="nav-btn primary">↺ مرور دوباره داستان از ابتدا</button>
              </div>
            ` : `
              <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);font-weight:600;">
                پاسخ داده‌شده: ${answeredCount.toLocaleString('fa-IR')} از ۴ سوال — پس از پاسخ به همه سوالات، کارنامه نهایی نمایش داده می‌شود.
              </div>
            `}
          `;
        }

        bindChapterEvents();
        updateNavButtons();
      }

      function bindChapterEvents() {
        const body = document.getElementById('storyBody');

        // Chapter 1-5 Checkpoints
        const cpBox = body.querySelector('[data-checkpoint]');
        if (cpBox) {
          const cid = Number(cpBox.dataset.checkpoint);
          cpBox.querySelectorAll('.quiz-opt').forEach(btn => {
            btn.addEventListener('click', () => {
              const optIdx = Number(btn.dataset.opt);
              state.checkpoints[cid] = optIdx;
              if (state.unlockedStep < cid + 1) {
                state.unlockedStep = cid + 1;
                showToast(`🔓 فصل ${(cid + 2).toLocaleString('fa-IR')} باز شد! سرنخ جدید به پرونده اضافه شد.`);
              }
              saveState();
              renderAll();
            });
          });
        }

        // Chapter 2 Subtabs
        body.querySelectorAll('[data-ch2tab]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.ch2Tab = btn.dataset.ch2tab;
            saveState();
            renderChapter();
          });
        });

        // Chapter 3 Mimic cards
        body.querySelectorAll('[data-mimic]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.mimic;
            state.inspectedMimics[id] = !state.inspectedMimics[id];
            saveState();
            renderChapter();
          });
        });

        // Chapter 4 Filters
        body.querySelectorAll('[data-filter]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.ch4Filter = btn.dataset.filter;
            saveState();
            renderChapter();
          });
        });

        // Chapter 5 CT Controls & Hotspots
        body.querySelectorAll('[data-ctpanel]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.ctPanel = btn.dataset.ctpanel;
            state.activeHotspot = state.ctPanel === 'A' ? 'A1' : 'B1';
            state.ctZoom = false;
            saveState();
            renderChapter();
          });
        });
        const zoomBtn = document.getElementById('btnCtZoom');
        if (zoomBtn) {
          zoomBtn.addEventListener('click', () => {
            state.ctZoom = !state.ctZoom;
            saveState();
            renderChapter();
          });
        }
        body.querySelectorAll('[data-pin]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeHotspot = btn.dataset.pin;
            saveState();
            renderChapter();
          });
        });

        // Chapter 6 Pathway Simulator
        body.querySelectorAll('[data-pmode]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.pathwayMode = btn.dataset.pmode;
            saveState();
            renderChapter();
          });
        });

        // Chapter 7 Final Exam
        body.querySelectorAll('[data-exam]').forEach(box => {
          const qid = box.dataset.exam;
          box.querySelectorAll('[data-exam-opt]').forEach(btn => {
            btn.addEventListener('click', () => {
              state.exam[qid] = Number(btn.dataset.examOpt);
              saveState();
              renderAll();
            });
          });
        });

        const replayBtn = document.getElementById('btnReplayEnd');
        if (replayBtn) {
          replayBtn.addEventListener('click', resetStory);
        }
      }

      function updateNavButtons() {
        const prevBtn = document.getElementById('btnPrev');
        const nextBtn = document.getElementById('btnNext');
        const hint = document.getElementById('navHint');
        const maxAllowed = getEffectiveMaxStep();

        prevBtn.disabled = state.currentStep === 0;
        if (state.currentStep === CHAPTERS.length - 1) {
          nextBtn.style.visibility = 'hidden';
          hint.textContent = 'پایان پرونده بالینی';
        } else {
          nextBtn.style.visibility = 'visible';
          const canAdvance = (state.currentStep + 1) <= maxAllowed;
          nextBtn.disabled = !canAdvance;
          nextBtn.textContent = state.currentStep === 5 ? 'ورود به آزمون نهایی ←' : 'فصل بعدی ←';
          hint.textContent = canAdvance
            ? `آماده رفتن به فصل ${(state.currentStep + 2).toLocaleString('fa-IR')}`
            : 'برای بازشدن فصل بعد، به ایستگاه تصمیم‌گیری پاسخ بده 🕵';
        }
      }

      function resetStory() {
        state.currentStep = 0;
        state.unlockedStep = 0;
        state.checkpoints = {};
        state.exam = {};
        state.inspectedMimics = {};
        state.ch2Tab = 'vitals';
        state.ch4Filter = 'all';
        state.ctPanel = 'A';
        state.ctZoom = false;
        state.activeHotspot = 'A1';
        state.pathwayMode = 'attack';
        saveState();
        renderAll();
        showToast('↺ پرونده از فصل اول بازنشانی شد.');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderAll() {
        applyTheme();
        document.getElementById('btnFreeExplore').classList.toggle('active', state.freeExplore);
        renderStepper();
        renderChapter();
        renderSidebar();
      }

      // Global Controls
      document.getElementById('btnPrev').addEventListener('click', () => {
        if (state.currentStep > 0) {
          state.currentStep--;
          saveState();
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      document.getElementById('btnNext').addEventListener('click', () => {
        if (state.currentStep < getEffectiveMaxStep()) {
          state.currentStep++;
          saveState();
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      document.getElementById('btnFreeExplore').addEventListener('click', () => {
        state.freeExplore = !state.freeExplore;
        saveState();
        renderAll();
        showToast(state.freeExplore ? '🔓 حالت مطالعه آزاد فعال شد — همه فصل‌ها باز هستند.' : '🔒 حالت داستانی قدم‌به‌قدم فعال شد.');
      });

      document.getElementById('btnTheme').addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        saveState();
        applyTheme();
      });

      document.getElementById('btnReset').addEventListener('click', resetStory);

      document.getElementById('tabDdx').addEventListener('click', () => {
        state.sideTab = 'ddx';
        saveState();
        renderSidebar();
      });

      document.getElementById('tabClues').addEventListener('click', () => {
        state.sideTab = 'clues';
        saveState();
        renderSidebar();
      });

      // Mobile drawer
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('drawerBackdrop');
      function toggleDrawer(open) {
        sidebar.classList.toggle('open', open);
        backdrop.classList.toggle('open', open);
      }
      document.getElementById('btnMobileBoard').addEventListener('click', () => toggleDrawer(true));
      backdrop.addEventListener('click', () => toggleDrawer(false));

      // RTL Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft' && state.currentStep < getEffectiveMaxStep()) {
          state.currentStep++;
          saveState();
          renderAll();
        } else if (e.key === 'ArrowRight' && state.currentStep > 0) {
          state.currentStep--;
          saveState();
          renderAll();
        }
      });

      renderAll();
    })();
  </script>
</body>
</html>
