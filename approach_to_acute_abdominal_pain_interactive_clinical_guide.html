                    ${filteredSubs.map(sg => `
                      <div>
                        <span class="inline-block text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md mb-2 ${
                          sg.color === 'amber' ? 'bg-amber-100 text-amber-800' : sg.color === 'sky' ? 'bg-sky-100 text-sky-800' : 'bg-slate-100 text-slate-700'
                        }">${sg.type}</span>
                        <ul class="space-y-1.5">
                          ${sg.items.map(it => `<li class="text-sm text-slate-700 flex items-start gap-2"><span class="text-teal-600 font-bold">•</span><span>${it}</span></li>`).join("")}
                        </ul>
                      </div>
                    `).join("")}
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <!-- Generalized & Rare Causes -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <h3 class="text-base font-bold text-slate-900 mb-3">Generalized / Poorly Localized Etiologies</h3>
              <div class="space-y-2.5">
                ${GENERALIZED_CAUSES.map(c => `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200">
                    <div class="text-sm font-bold text-slate-900">${c.name}</div>
                    <div class="text-xs text-slate-600 mt-0.5">${c.note}</div>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-base font-bold text-slate-900">Rare ("Don't Forget") Causes</h3>
                <span class="text-xs font-semibold text-rose-700 bg-rose-50 px-2.5 py-0.5 rounded-full">High-Yield Pearls</span>
              </div>
              <div class="space-y-2.5">
                ${RARE_CAUSES.map(c => `
                  <div class="p-3 rounded-xl bg-rose-50/40 border border-rose-200/70">
                    <div class="text-sm font-bold text-slate-900">${c.name}</div>
                    <div class="text-xs text-slate-700 mt-0.5">${c.pearl}</div>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStep3() {
      const activeStage = WORKUP_STAGES.find(w => w.id === state.activeWorkupTab);
      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h2 class="text-lg sm:text-xl font-bold text-slate-900">Step 3: Step-by-Step Clinical Evaluation</h2>
            <p class="text-sm text-slate-600 mt-1">
              Move systematically from <strong>History → Physical Exam → Labs → Imaging</strong>. Check off each clinical pearl as you review it.
            </p>
            <div class="flex flex-wrap gap-2 mt-4">
              ${WORKUP_STAGES.map(st => `
                <button type="button" data-workup="${st.id}" class="workup-tab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition ${
                  state.activeWorkupTab === st.id ? "bg-teal-600 text-white border-teal-600 shadow-sm" : "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100"
                }">${st.title}</button>
              `).join("")}
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold text-slate-900">${activeStage.title}</h3>
              <span class="text-xs text-slate-500">Click items to mark reviewed</span>
            </div>
            <div class="space-y-3">
              ${activeStage.items.map((item, idx) => {
                const key = `${activeStage.id}_${idx}`;
                const checked = state.checkedPearls.has(key);
                return `
                  <label class="flex items-start gap-3 p-4 rounded-xl border cursor-pointer transition ${
                    checked ? "bg-teal-50/70 border-teal-300" : "bg-slate-50 border-slate-200 hover:bg-slate-100/70"
                  }">
                    <input type="checkbox" data-pearl="${key}" class="pearl-checkbox mt-1 h-4 w-4 rounded border-slate-300 text-teal-600 focus:ring-teal-500" ${checked ? "checked" : ""}/>
                    <div>
                      <div class="text-sm font-bold text-slate-900">${item.label}</div>
                      <div class="text-sm text-slate-600 mt-1 leading-relaxed">${item.detail}</div>
                    </div>
                  </label>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderStep4() {
      const scripts = ILLNESS_SCRIPTS[state.scriptGroup];
      const activeList = scripts.filter(s => state.selectedScripts.has(s.id));
      const rows = [
        { key: "pain", label: "Pain & Chronology" },
        { key: "associated", label: "Associated Symptoms" },
        { key: "risks", label: "Risk Factors / Etiology" },
        { key: "exam", label: "Physical Exam" },
        { key: "labs", label: "Key Labs" },
        { key: "dx", label: "Diagnostic Test" }
      ];

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="text-lg sm:text-xl font-bold text-slate-900">Step 4: Illness Scripts Comparator</h2>
                <p class="text-sm text-slate-600 mt-1">
                  Compare classic presentations side-by-side, or turn on <strong>Self-Test Mode</strong> to hide cells and recall features before clicking to reveal.
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <div class="inline-flex rounded-xl bg-slate-100 p-1">
                  <button type="button" id="sg-midline" class="px-3 py-1 rounded-lg text-xs font-semibold transition ${state.scriptGroup === 'midline' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600'}">General / Midline (5)</button>
                  <button type="button" id="sg-ruq" class="px-3 py-1 rounded-lg text-xs font-semibold transition ${state.scriptGroup === 'ruq' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600'}">RUQ Causes (4)</button>
                </div>
                <button type="button" id="toggle-blind-btn" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
                  state.quizBlindMode ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-700 border-slate-300 hover:bg-slate-50"
                }">
                  ${state.quizBlindMode ? "Self-Test Mode: ON" : "Self-Test Mode: OFF"}
                </button>
              </div>
            </div>

            <!-- Diagnosis Filter Chips -->
            <div class="flex flex-wrap gap-2 mt-4">
              ${scripts.map(s => {
                const on = state.selectedScripts.has(s.id);
                return `
                  <button type="button" data-script="${s.id}" class="script-chip px-3 py-1.5 rounded-full text-xs font-semibold border transition ${
                    on ? "bg-teal-50 text-teal-800 border-teal-300" : "bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100"
                  }">
                    ${on ? "✓ " : "+ "}${s.name}
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- Comparison Table -->
          ${activeList.length === 0 ? `
            <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
              Select at least one diagnosis above to compare its illness script.
            </div>
          ` : `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[640px]">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200">
                    <th class="p-3.5 text-xs font-bold uppercase tracking-wider text-slate-500 w-40">Feature</th>
                    ${activeList.map(s => `<th class="p-3.5 text-sm font-bold text-slate-900 border-l border-slate-200">${s.name}</th>`).join("")}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  ${rows.map(r => `
                    <tr>
                      <td class="p-3.5 text-xs font-bold text-slate-700 bg-slate-50/50 align-top">${r.label}</td>
                      ${activeList.map(s => {
                        const cellKey = `${s.id}_${r.key}`;
                        const hidden = state.quizBlindMode && !state.revealedCells.has(cellKey);
                        return `
                          <td class="p-3.5 text-xs sm:text-sm text-slate-700 border-l border-slate-200 align-top">
                            ${hidden ? `
                              <button type="button" data-cell="${cellKey}" class="reveal-cell-btn w-full py-2 px-3 rounded-lg bg-indigo-50 text-indigo-700 font-semibold text-xs hover:bg-indigo-100 transition">
                                Click to Reveal
                              </button>
                            ` : s[r.key]}
                          </td>
                        `;
                      }).join("")}
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function renderStep5() {
      const signCount = state.checkedSurgicalSigns.size;
      const c = CASES[state.caseIndex];
      const chosen = state.caseAnswers[state.caseIndex];
      const answered = chosen !== undefined;

      return `
        <div class="space-y-6">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Surgical Abdomen Interactive Bedside Checklist -->
            <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <div class="flex items-center justify-between gap-2 mb-2">
                <h2 class="text-lg font-bold text-slate-900">Surgical Abdomen Bedside Checklist</h2>
                <span class="text-xs font-bold px-2.5 py-1 rounded-full ${signCount >= 2 ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-600'}">
                  ${signCount} Selected
                </span>
              </div>
              <p class="text-xs text-slate-600 mb-3">
                A <strong>surgical abdomen</strong> implies emergent surgical evaluation. None of these findings in isolation is diagnostic, but <strong>multiple findings</strong> + consistent history strongly suggest a surgical emergency.
              </p>

              <div class="space-y-2 mb-4">
                ${SURGICAL_SIGNS.map(sg => {
                  const on = state.checkedSurgicalSigns.has(sg.id);
                  return `
                    <label class="flex items-start gap-2.5 p-2.5 rounded-xl border cursor-pointer transition ${on ? 'bg-rose-50 border-rose-300' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}">
                      <input type="checkbox" data-surg="${sg.id}" class="surg-checkbox mt-0.5 h-4 w-4 rounded border-slate-300 text-rose-600" ${on ? 'checked' : ''}/>
                      <div>
                        <div class="text-xs font-bold text-slate-900">${sg.label}</div>
                        <div class="text-xs text-slate-600">${sg.note}</div>
                      </div>
                    </label>
                  `;
                }).join("")}
              </div>

              <div class="p-3 rounded-xl border text-xs ${signCount >= 2 ? 'bg-rose-600 text-white border-rose-700' : 'bg-amber-50 text-amber-900 border-amber-200'}">
                ${signCount >= 2
                  ? '<strong>Action Alert:</strong> Multiple peritoneal/surgical signs present—obtain emergent surgical consultation!'
                  : '<strong>Critical Caveat:</strong> Not every surgical emergency has a surgical abdomen (e.g., extraperitoneal emergencies like a ruptured AAA).'}
              </div>
            </div>

            <!-- Shock Differential -->
            <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-base font-bold text-slate-900">Abdominal Pain + Shock</h3>
                <span class="text-xs font-bold bg-rose-100 text-rose-800 px-2.5 py-0.5 rounded-full">8 Must-Not-Miss</span>
              </div>
              <p class="text-xs text-slate-600 mb-3">
                Always prioritize these 8 life-threatening conditions when a patient presents with abdominal pain and shock:
              </p>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2">
                ${SHOCK_CAUSES.map((sc, i) => `
                  <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                    <span class="text-xs font-bold text-slate-900">${i + 1}. ${sc.name}</span>
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-rose-50 text-rose-700">${sc.tag}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>

          <!-- Interactive Case Simulator -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <h3 class="text-lg font-bold text-slate-900">Clinical Case Simulator</h3>
                <p class="text-xs text-slate-500">Apply your step-by-step approach to 5 bedside vignettes</p>
              </div>
              <div class="flex items-center gap-1.5">
                ${CASES.map((_, idx) => {
                  const ans = state.caseAnswers[idx];
                  const isCorrect = ans === CASES[idx].correct;
                  return `
                    <button type="button" data-case="${idx}" class="case-nav-btn w-8 h-8 rounded-lg text-xs font-bold border transition ${
                      state.caseIndex === idx
                        ? "bg-teal-600 text-white border-teal-600"
                        : ans !== undefined
                          ? isCorrect ? "bg-emerald-50 text-emerald-700 border-emerald-300" : "bg-rose-50 text-rose-700 border-rose-300"
                          : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100"
                    }">${idx + 1}</button>
                  `;
                }).join("")}
              </div>
            </div>

            <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 mb-4">
              <div class="text-xs font-bold uppercase tracking-wider text-teal-700 mb-1">Case ${state.caseIndex + 1} of ${CASES.length}</div>
              <p class="text-sm text-slate-800 leading-relaxed">${c.vignette}</p>
            </div>

            <p class="text-sm font-bold text-slate-900 mb-3">${c.question}</p>

            <div class="space-y-2 mb-4">
              ${c.options.map((opt, idx) => {
                let cls = "bg-white border-slate-200 hover:bg-slate-50 text-slate-800";
                if (answered) {
                  if (idx === c.correct) cls = "bg-emerald-50 border-emerald-400 text-emerald-900 font-semibold";
                  else if (idx === chosen) cls = "bg-rose-50 border-rose-400 text-rose-900";
                  else cls = "bg-slate-50 border-slate-200 text-slate-400";
                }
                return `
                  <button type="button" data-opt="${idx}" ${answered ? "disabled" : ""} class="case-opt-btn w-full text-left p-3.5 rounded-xl border text-sm transition ${cls}">
                    <span class="font-bold mr-2">${String.fromCharCode(65 + idx)}.</span>${opt}
                  </button>
                `;
              }).join("")}
            </div>

            ${answered ? `
              <div class="p-4 rounded-xl border fade-in ${chosen === c.correct ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'}">
                <div class="text-xs font-bold uppercase tracking-wider mb-1">
                  ${chosen === c.correct ? "✓ Correct Clinical Reasoning" : "Review Reasoning"}
                </div>
                <p class="text-sm leading-relaxed">${c.explanation}</p>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function attachStepListeners() {
      // Step 1
      const m9 = document.getElementById("mode-9");
      const m4 = document.getElementById("mode-4");
      if (m9) m9.addEventListener("click", () => { state.mapMode = "9region"; renderAll(); });
      if (m4) m4.addEventListener("click", () => { state.mapMode = "4quadrant"; renderAll(); });

      const radBtn = document.getElementById("toggle-radiation-btn");
      if (radBtn) radBtn.addEventListener("click", () => { state.showRadiation = !state.showRadiation; renderAll(); });

      document.querySelectorAll("[data-region]").forEach(el => {
        el.addEventListener("click", () => { state.selectedRegion = el.dataset.region; renderAll(); });
      });
      document.querySelectorAll("[data-quad]").forEach(el => {
        el.addEventListener("click", () => { state.selectedQuadrant = el.dataset.quad; renderAll(); });
      });
      document.querySelectorAll(".app-phase-btn").forEach(el => {
        el.addEventListener("click", () => { state.appPhaseIndex = Number(el.dataset.phase); renderAll(); });
      });

      // Step 2
      document.querySelectorAll(".ruq-filter-btn").forEach(el => {
        el.addEventListener("click", () => { state.ruqFilter = el.dataset.ruqfilter; renderAll(); });
      });

      // Step 3
      document.querySelectorAll(".workup-tab-btn").forEach(el => {
        el.addEventListener("click", () => { state.activeWorkupTab = el.dataset.workup; renderAll(); });
      });
      document.querySelectorAll(".pearl-checkbox").forEach(el => {
        el.addEventListener("change", () => {
          if (el.checked) state.checkedPearls.add(el.dataset.pearl);
          else state.checkedPearls.delete(el.dataset.pearl);
          renderAll();
        });
      });

      // Step 4
      const sgMid = document.getElementById("sg-midline");
      const sgRuq = document.getElementById("sg-ruq");
      const blindBtn = document.getElementById("toggle-blind-btn");
      if (sgMid) sgMid.addEventListener("click", () => {
        state.scriptGroup = "midline";
        state.selectedScripts = new Set(["pud", "appendicitis", "pancreatitis"]);
        renderAll();
      });
      if (sgRuq) sgRuq.addEventListener("click", () => {
        state.scriptGroup = "ruq";
        state.selectedScripts = new Set(["biliary_colic", "cholecystitis", "cholangitis", "hepatitis"]);
        renderAll();
      });
      if (blindBtn) blindBtn.addEventListener("click", () => {
        state.quizBlindMode = !state.quizBlindMode;
        state.revealedCells.clear();
        renderAll();
      });
      document.querySelectorAll(".script-chip").forEach(el => {
        el.addEventListener("click", () => {
          const id = el.dataset.script;
          if (state.selectedScripts.has(id)) state.selectedScripts.delete(id);
          else state.selectedScripts.add(id);
          renderAll();
        });
      });
      document.querySelectorAll(".reveal-cell-btn").forEach(el => {
        el.addEventListener("click", () => {
          state.revealedCells.add(el.dataset.cell);
          renderAll();
        });
      });

      // Step 5
      document.querySelectorAll(".surg-checkbox").forEach(el => {
        el.addEventListener("change", () => {
          if (el.checked) state.checkedSurgicalSigns.add(el.dataset.surg);
          else state.checkedSurgicalSigns.delete(el.dataset.surg);
          renderAll();
        });
      });
      document.querySelectorAll(".case-nav-btn").forEach(el => {
        el.addEventListener("click", () => {
          state.caseIndex = Number(el.dataset.case);
          renderAll();
        });
      });
      document.querySelectorAll(".case-opt-btn").forEach(el => {
        el.addEventListener("click", () => {
          state.caseAnswers[state.caseIndex] = Number(el.dataset.opt);
          renderAll();
        });
      });
    }

    function renderAll() {
      renderNav();
      const container = document.getElementById("step-container");
      if (state.currentStep === 1) container.innerHTML = renderStep1();
      else if (state.currentStep === 2) container.innerHTML = renderStep2();
      else if (state.currentStep === 3) container.innerHTML = renderStep3();
      else if (state.currentStep === 4) container.innerHTML = renderStep4();
      else if (state.currentStep === 5) container.innerHTML = renderStep5();
      attachStepListeners();
    }

    // Global Footer & Reset Controls
    document.getElementById("prev-step-btn").addEventListener("click", () => {
      if (state.currentStep > 1) {
        state.currentStep--;
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("next-step-btn").addEventListener("click", () => {
      state.completedSteps.add(state.currentStep);
      saveProgress();
      if (state.currentStep < STEPS.length) {
        state.currentStep++;
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    document.getElementById("mark-complete-btn").addEventListener("click", () => {
      if (state.completedSteps.has(state.currentStep)) state.completedSteps.delete(state.currentStep);
      else state.completedSteps.add(state.currentStep);
      saveProgress();
      renderAll();
    });

    document.getElementById("reset-progress-btn").addEventListener("click", () => {
      state.completedSteps.clear();
      state.checkedPearls.clear();
      state.checkedSurgicalSigns.clear();
      state.caseAnswers = {};
      state.revealedCells.clear();
      state.currentStep = 1;
      saveProgress();
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
